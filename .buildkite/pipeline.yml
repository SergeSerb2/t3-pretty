# Origin-connected Buildkite entrypoint for T3 Pretty.
# Buildkite decides when a build starts (push, schedule, or New Build).
# The GitHub Actions plugin then decides which workflow files are eligible
# for that event. Path filters are not supported by the importer, so the
# workflows themselves skip no-op desktop/mobile work.
#
# Queues (hybrid: Origin gates + fork cluster secrets stay self-hosted;
# packaging is temporarily back on self-hosted because hosted M4 /
# linux-small jobs cancel immediately — BK #1944/#1948):
#   linux-small     — hosted Linux (CLI, AppImage). Hosted dispatch
#                     currently auto-cancels these jobs in ~100ms with
#                     empty logs / waiting_failed (BK #1944/#1948/#1952).
#                     AppImage stays here — do not send it to
#                     macos-release + os=linux: that matches arm64
#                     m1-linux-t3code-fork and any review-only Linux
#                     agents, and the script requires x86_64.
#                     linux-appimage and publish-cli soft_fail so a
#                     hosted cancel cannot red the Mac/iOS/Android
#                     packaging build. Imported ubuntu-latest GHA
#                     children (Resolve, WSL, concurrency gates) are
#                     skipped for the same reason: the github-actions
#                     plugin uploads them without inheriting
#                     origin-workflows soft_fail, so they still red
#                     the build.
#   macos-medium    — hosted MACOS_ARM64_M4_6X28 (pipeline upload). No
#                     Origin CLI / no CURSOR_API_KEY /
#                     no GITHUB_MIRROR_SSH_KEY / no PLANETSCALE_* . Hosted
#                     agents cannot resolve those cluster secrets; do not
#                     assign Origin gates or secretful Mirror/Relay here.
#                     Android Internal used this until the same hosted
#                     cancel (BK #1944/#1948).
#   macos-large     — hosted MACOS_ARM64_M4_12X56. Signed DMG and iOS used
#                     this (Apple signing imports CSC_LINK / APPLE_API_KEY
#                     into a per-job temp keychain). Hosted M4 jobs now
#                     auto-cancel the same way (last green hosted Mac DMG
#                     was BK #1904).
#   macos-release   — self-hosted Serge Mac / review-only Linux /
#                     m1-linux-t3code-fork. Origin PR review, comments,
#                     GHA importer, upstream sync, GitHub mirror, and
#                     relay stay here: they need CURSOR_API_KEY, the
#                     origin CLI, GITHUB_MIRROR_SSH_KEY, PLANETSCALE_*,
#                     and/or the macos-release file-store fallbacks.
#                     Hosted M4 lacks those today (BK 1876/1878/1880).
#                     Temporary packaging also runs here: macos-dmg,
#                     ios-mobile, and android-mobile (os=macos).
#   windows-release — serge-pc native NSIS (cannot run on Mac)
#
# TODO: restore hosted queues for packaging (macos-large DMG/iOS,
# macos-medium Android), drop soft_fail on linux-appimage /
# publish-cli, and restore the origin-workflows GHA import
# (fork-release.yml ubuntu-latest jobs + concurrency) once
# Buildkite/Namespace hosted dispatch works again.
# Target hosted Mac queues by key only when that lands — extra tags
# like os=macos can leave hosted M4 unmatched. Until then,
# macos-release packaging steps keep os=macos so the mixed pool
# (Serge Mac + Linux review + m1-linux-t3code-fork) cannot take
# Apple/Android jobs. Origin PR review and comments stay queue-wide
# so the review-only Linux agent can take them. The Buildkite
# default upload step is macos-medium (pipeline settings, not this
# file); upload does not need Origin secrets.
#
# Do not list YAML `secrets:` on these steps. Hosted agents currently
# 500 while fetching them; self-hosted packaging does not need that
# path. Public values stay in `env`. Private keys stay in the cluster
# or macos-release file-store; jobs load them after checkout with
# scripts/fork/load-buildkite-secrets.sh.

env:
  # loadRepoEnv selects .env.internal.example from this before compiling each surface.
  T3CODE_BUILD_FLAVOR: internal
  T3CODE_DESKTOP_UPDATE_FEED_URL: "https://pub-8033bcab5baf492b81c605581ff028e0.r2.dev/t3-pretty/latest/"
  T3CODE_RELEASE_S3_BUCKET: t3-pretty-releases
  T3CODE_RELEASE_S3_ENDPOINT: "https://a6f705b8c6459d937d32d31555f9fbf6.r2.cloudflarestorage.com"
  T3CODE_RELEASE_S3_REGION: auto
  APPLE_TEAM_ID: "78A5P57U23"
  T3CODE_APPLE_TEAM_ID: "78A5P57U23"
  T3CODE_IOS_SHARE_EXTENSION: "0"
  T3CODE_MOBILE_EAS_PROJECT_ID: "1eb51d67-48c5-4100-8aa8-f5ac9e1ada65"
  T3CODE_MOBILE_EXPO_OWNER: sergeserbinenkoteam
  T3CODE_MOBILE_EXPO_SLUG: t3-pretty
  T3CODE_MOBILE_UPDATE_URL: "https://u.expo.dev/1eb51d67-48c5-4100-8aa8-f5ac9e1ada65"
  APNS_BUNDLE_ID: com.sergeserbinenko.t3pretty
  APNS_ENVIRONMENT: sandbox
  APNS_KEY_ID: 6RKSND9F2B
  APNS_TEAM_ID: "78A5P57U23"

steps:
  - label: ":github: Mirror Origin main and release tags"
    key: github-mirror
    # Hard-fail on purpose: silent drift violates the required Origin -> GitHub mirror.
    # This independent step does not gate the internal packaging steps below.
    if: 'build.branch == "main" && build.source != "schedule"'
    agents:
      # GITHUB_MIRROR_SSH_KEY is a fork cluster secret. Hosted macos-medium
      # cannot resolve it (BK 1878/1880: "cluster secret ... is not
      # available on this agent"). Keep this on macos-release with os=macos
      # so the Linux review-only agent cannot take it.
      queue: macos-release
      os: macos
    # Buildkite interpolates ${VAR} in command: before the step runs.
    # Check the sourced secret in mirror-github.sh, not in this block.
    command: |
      . scripts/fork/load-buildkite-secrets.sh GITHUB_MIRROR_SSH_KEY
      export GITHUB_MIRROR_REPO="${GITHUB_MIRROR_REPO:-SergeSerb2/t3-pretty}"
      bash scripts/fork/mirror-github.sh
  - label: ":github: T3 Pretty Origin workflows"
    key: origin-workflows
    # github-actions#v0.13.0 uploads child steps that do not inherit
    # this step's soft_fail. Hosted linux-small auto-cancels those
    # children (gha-concurrency-start/finish, Resolve, WSL) in ~100ms
    # with waiting_failed / canceled (BK #1944/#1948/#1952). Native
    # macos-dmg / windows-nsis / ios / android do not depend on them.
    # The plugin has no child soft_fail option; continue-on-error does
    # not tolerate infrastructure cancel. Skip the importer until
    # hosted linux-small dispatch works.
    # TODO: drop skip and restore `if: build.source != "schedule"`
    # (and the ubuntu jobs in fork-release.yml) once hosted
    # linux-small works.
    soft_fail: true
    # skip reason max 70 chars (BK rejected the longer #288 wording).
    skip: "GHA children on linux-small hard-fail (BK #1952)"
    # if: build.source != "schedule"
    # Bound the importer so a hung GHA child cannot leave this step running
    # for hours on linux-small. Native Mac/Windows/Linux steps do not depend
    # on it.
    timeout_in_minutes: 30
    agents:
      # buildkite-gha uploads its generated pipeline with --reject-secrets.
      # Hosted Agent v4 does not provide that flag and hosted M4 currently
      # fails to compile the plugin (Go 1.26 vs 1.27). Self-hosted
      # macos-release runs Agent v3 and a matching Go toolchain.
      queue: macos-release
      os: macos
    plugins:
      - github-actions#v0.13.0:
          # Exact commit tagged v0.35.1. Source mode avoids mise's flaky
          # GitHub release-asset/attestation lookup on cold hosted workers.
          source-ref: "c7ff9d131237da5a5eac55f855ff29da8f4dc5dc"
          workflows:
            - .github/workflows/fork-release.yml
          # Mapping kept for the restore. Jobs in fork-release.yml are
          # skipped until hosted linux-small dispatch works; do not
          # retarget them to macos-release + os=linux (arm64).
          runners:
            - runs-on: ubuntu-latest
              queue: linux-small
            - runs-on: macos-latest
              queue: macos-release
            - runs-on: macos-15
              queue: macos-release
            - runs-on: macos-14
              queue: macos-release

  # Hosted linux-small and hosted M4 cannot load CURSOR_API_KEY.
  # macos-release has the secret files and the origin CLI. Run review
  # scripts from origin/main when present so a feature branch cannot
  # swap the secret-loading script.
  - label: ":git: Upstream Sync"
    key: upstream-sync
    # The four-hour schedule is this job. Do not import
    # fork-upstream-sync.yml: macos GHA steps need GITHUB_OUTPUT
    # for discover, and the importer often leaves that file unset.
    if: 'build.branch == "main" && (build.source == "schedule" || build.source == "ui" || build.source == "api")'
    # Build 1241 finished with 26 seconds of margin at 120; a backlog merge
    # that times out re-pays its conflicts next run, so keep headroom.
    timeout_in_minutes: 180
    concurrency: 1
    concurrency_group: "t3-pretty/upstream-sync"
    # Ahead of Origin PR review so a feature-branch review cannot occupy
    # the packaging Mac in front of a nightly that is already late.
    priority: 30
    agents:
      queue: macos-release
      os: macos
    command: bash scripts/fork/run-upstream-sync.sh

  - label: ":mag: Origin PR Review"
    key: origin-pr-review
    # Origin does not reliably start a second Buildkite build when a PR opens.
    # Let the push build run; the review script briefly waits for the PR.
    if: >-
      build.branch != "main" && build.source != "schedule" &&
      !(build.branch =~ /^automation\//)
    timeout_in_minutes: 20
    # Many PRs review in parallel (review-only Macs spawn 10 workers), but
    # never two reviewers on the same PR: the per-branch group serializes a
    # branch's review and comments-check jobs across builds. A step supports
    # one concurrency group, so the 10-reviewer bound comes from the worker
    # count, not a second group.
    concurrency: 1
    concurrency_group: "t3-pretty/origin-pr-review/$BUILDKITE_BRANCH"
    agents:
      # Queue-wide: review-only Linux agents on macos-release can take this.
      # Hosted macos-medium has neither origin nor CURSOR_API_KEY (BK 1864).
      queue: macos-release
    command: bash scripts/fork/run-trusted-origin-pr-ci.sh

  - label: ":white_check_mark: Origin PR comments resolved"
    key: origin-pr-comments
    depends_on: origin-pr-review
    allow_dependency_failure: true
    if: >-
      build.branch != "main" && build.source != "schedule" &&
      !(build.branch =~ /^automation\//)
    timeout_in_minutes: 10
    # Same per-branch group as origin-pr-review so a comments check never
    # overlaps another build's review of the same PR.
    concurrency: 1
    concurrency_group: "t3-pretty/origin-pr-review/$BUILDKITE_BRANCH"
    agents:
      queue: macos-release
    command: bash scripts/fork/run-trusted-origin-pr-ci.sh check

  - label: ":npm: CLI tarball"
    key: publish-cli
    depends_on: macos-dmg
    # Headless `npx t3` is upstream T3 Code. Pack the version macos-dmg just
    # stamped — remotes fetch t3-<appVersion>.tgz, so reminting 404s.
    # Skipped when DMG skips (PRs, scheduled sync). Do not promote t3.tgz
    # from a failed or non-desktop revision.
    # Hosted linux-small currently auto-cancels / waiting_failed
    # (BK #1944/#1948). soft_fail so that cannot red the build while
    # Mac/iOS/Android package on macos-release.
    soft_fail: true
    if: build.branch == "main" && build.source != "schedule"
    timeout_in_minutes: 40
    agents:
      queue: linux-small
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuc2VyZ2VzZXJiaW5lbmtvLmNvbSQ
    command: bash scripts/fork/publish-cli.sh

  - label: ":windows: Windows NSIS"
    key: windows-nsis
    # Start with the importer, not after it. Desktop compile failures must
    # not cancel the Windows agent job while it is still waiting.
    # Scheduled builds exist only to run upstream sync. Do not rebuild NSIS
    # every four hours when main has not changed.
    if: build.branch == "main" && build.source != "schedule"
    timeout_in_minutes: 90
    agents:
      queue: windows-release
    command: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/fork/build-windows-nsis.ps1

  - label: ":linux: Linux x64 AppImage"
    key: linux-appimage
    # Stay on hosted linux-small (x86_64). Do not use macos-release +
    # os=linux: that lands on arm64 m1-linux-t3code-fork and any
    # review-only Linux agents; build-linux-appimage.sh requires x86_64
    # and would red the build. Hosted linux-small currently auto-cancels
    # / waiting_failed (BK #1944/#1948). soft_fail so that cannot red
    # the build while Mac/iOS/Android package on macos-release.
    # TODO: drop soft_fail once hosted dispatch works again.
    soft_fail: true
    if: build.branch == "main" && build.source != "schedule"
    timeout_in_minutes: 90
    agents:
      queue: linux-small
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuc2VyZ2VzZXJiaW5lbmtvLmNvbSQ
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: "/bin/true"
    command: bash scripts/fork/build-linux-appimage.sh

  - label: ":mac: macOS arm64 DMG"
    key: macos-dmg
    # Both Apple builds replace the user keychain search list while signing.
    concurrency: 1
    concurrency_group: "t3-pretty/apple-signing"
    if: build.branch == "main" && build.source != "schedule"
    timeout_in_minutes: 60
    # Temporarily on macos-release + os=macos. Hosted macos-large
    # auto-cancels in ~100ms with empty logs (BK #1944/#1948).
    # TODO: restore queue: macos-large (key only) once hosted dispatch works.
    agents:
      queue: macos-release
      os: macos
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuc2VyZ2VzZXJiaW5lbmtvLmNvbSQ
    command: bash scripts/fork/build-macos-dmg.sh

  # Native iOS OTA + TestFlight. Do not import a GitHub Actions mobile
  # workflow: the importer cannot load EXPO_TOKEN / Apple keys and the job
  # dies in ~2s before eas update runs. Installed TestFlight binaries then
  # stay on the last JS bundle that actually published.
  - label: ":iphone: iOS OTA + TestFlight"
    key: ios-mobile
    concurrency: 1
    concurrency_group: "t3-pretty/apple-signing"
    # Ahead of Origin PR review so a feature-branch review cannot sit
    # in front of TestFlight.
    priority: 20
    if: build.branch == "main" && build.source != "schedule"
    timeout_in_minutes: 90
    # Temporarily on macos-release + os=macos. Hosted macos-large
    # auto-cancels in ~100ms (BK #1944/#1948).
    # TODO: restore queue: macos-large (key only) once hosted dispatch works.
    agents:
      queue: macos-release
      os: macos
    env:
      APP_VARIANT: production
      NODE_OPTIONS: "--max-old-space-size=8192"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      APPLE_TEAM_ID: "78A5P57U23"
      T3CODE_APPLE_TEAM_ID: "78A5P57U23"
    command: bash scripts/fork/publish-mobile-release.sh

  # Android uses the same fork-owned EAS project and production OTA channel as
  # iOS, but its native binary is built in EAS cloud and submitted to Google
  # Play internal testing. Until the one-time Play/EAS setup is complete, the
  # script leaves an explicit warning annotation and exits without pretending
  # that a binary shipped.
  - label: ":android: Android Internal"
    key: android-mobile
    concurrency: 1
    concurrency_group: "t3-pretty/android-signing"
    priority: 20
    if: build.branch == "main" && build.source != "schedule"
    timeout_in_minutes: 120
    # Temporarily on macos-release + os=macos. Hosted macos-medium
    # auto-cancels in ~100ms (BK #1944/#1948).
    # TODO: restore queue: macos-medium (key only) once hosted dispatch works.
    agents:
      queue: macos-release
      os: macos
    env:
      APP_VARIANT: production
      T3CODE_ANDROID_RELEASE_FLAVOR: internal
      NODE_OPTIONS: "--max-old-space-size=8192"
    command: bash scripts/fork/publish-android-release.sh

  # Public Android stays deliberately manual while it is in closed testing.
  # Start a main build from the Buildkite UI with
  # T3CODE_PUBLIC_ANDROID_RELEASE=1 to build the separate public application,
  # connect it to official T3 Connect, and submit it to Play internal testing.
  - label: ":android: Android public closed test"
    key: public-android-mobile
    concurrency: 1
    concurrency_group: "t3-pretty/android-signing"
    priority: 25
    if: >-
      build.branch == "main" && build.source == "ui" &&
      build.env("T3CODE_PUBLIC_ANDROID_RELEASE") == "1"
    timeout_in_minutes: 120
    agents:
      queue: macos-medium
    env:
      APP_VARIANT: production
      T3CODE_BUILD_FLAVOR: public
      T3CODE_ANDROID_RELEASE_FLAVOR: public
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
      T3CODE_RELAY_URL: https://relay.t3.codes
      NODE_OPTIONS: "--max-old-space-size=8192"
    command: bash scripts/fork/publish-android-release.sh

  - label: ":cloud: Relay"
    key: deploy-relay
    # PLANETSCALE_* / Clerk / Axiom tokens live in the macos-release
    # cluster secret store and file-store fallbacks. Hosted macos-medium
    # cannot resolve them (BK 1878/1880: "Missing relay secret:
    # PLANETSCALE_API_TOKEN_ID"). Keep production deploys on macos-release.
    if: build.branch == "main" && build.source != "schedule"
    timeout_in_minutes: 20
    agents:
      queue: macos-release
      os: macos
    env:
      CLOUDFLARE_ACCOUNT_ID: a6f705b8c6459d937d32d31555f9fbf6
      PLANETSCALE_ORGANIZATION: serge-serbinenko
      AXIOM_ORG_ID: surgecode-nmf2
      RELAY_DOMAIN: relay.sergeserbinenko.com
      RELAY_API_ZONE_NAME: sergeserbinenko.com
      RELAY_TUNNEL_ZONE_NAME: sergeserbinenko.com
      CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuc2VyZ2VzZXJiaW5lbmtvLmNvbSQ
      CLERK_JWT_AUDIENCE: t3-code-relay
      APNS_ENVIRONMENT: production
      APNS_TEAM_ID: "336W29P997"
      APNS_KEY_ID: 6RKSND9F2B
      APNS_BUNDLE_ID: com.sergeserb.sergecode
      ALCHEMY_TELEMETRY_DISABLED: "1"
    command: bash scripts/fork/deploy-relay-ci.sh
