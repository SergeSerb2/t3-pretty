name: T3 Pretty Upstream Sync

on:
  workflow_dispatch:
  schedule:
    # Six checks per day keep the fork close to the newest upstream nightly.
    - cron: "0 */4 * * *"

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    name: Sync newest upstream nightly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: discover
        name: Discover newest upstream nightly
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/pingdotgg/t3code.git
          latest_tag="$({
            git ls-remote --tags --refs upstream 'refs/tags/v*-nightly.*' |
              awk '{sub("refs/tags/", "", $2); print $2}' |
              sort -V |
              tail -n 1
          })"
          if [[ -z "$latest_tag" ]]; then
            echo "No upstream nightly tag found." >&2
            exit 1
          fi

          git fetch --no-tags upstream "refs/tags/$latest_tag:refs/tags/$latest_tag"
          current_tag=""
          if [[ -f .t3-fork/upstream-nightly ]]; then
            current_tag="$(tr -d '[:space:]' < .t3-fork/upstream-nightly)"
          fi
          echo "previous_tag=$current_tag" >> "$GITHUB_OUTPUT"
          # The resolver uses previous_tag..origin/main to recover the fork's
          # intent for conflicted paths. Fresh Actions clones do not have the
          # previous tag ref even though its commit is in main's history.
          if [[ -n "$current_tag" && "$current_tag" != "$latest_tag" ]]; then
            git fetch --no-tags upstream "refs/tags/$current_tag:refs/tags/$current_tag"
          fi

          if [[ "$current_tag" == "$latest_tag" ]] &&
            git merge-base --is-ancestor "$latest_tag^{commit}" HEAD; then
            echo "Fork already contains $latest_tag."
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="automation/upstream-${latest_tag//[^0-9A-Za-z._-]/-}"
          echo "has_update=true" >> "$GITHUB_OUTPUT"
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into an automation branch
        if: steps.discover.outputs.has_update == 'true'
        shell: bash
        env:
          CLI_PROXY_API_KEY: ${{ secrets.CLI_PROXY_API_KEY }}
          CLI_PROXY_API_URL: https://cli-proxy-api-production-1615.up.railway.app/v1
          CLI_PROXY_MODEL: gpt-5.6-sol
          CLI_PROXY_REASONING_EFFORT: xhigh
          CLI_PROXY_SERVICE_TIER: priority
          UPSTREAM_TAG: ${{ steps.discover.outputs.tag }}
          PREVIOUS_UPSTREAM_TAG: ${{ steps.discover.outputs.previous_tag }}
          SYNC_BRANCH: ${{ steps.discover.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "t3-pretty-sync[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          export REUSED_SYNC_RESOLUTION=false
          if git fetch origin "refs/heads/$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH" 2>/dev/null &&
            [[ "$(git show "origin/$SYNC_BRANCH:.t3-fork/upstream-nightly" 2>/dev/null | tr -d '[:space:]')" == "$UPSTREAM_TAG" ]] &&
            git merge-base --is-ancestor "$UPSTREAM_TAG^{commit}" "origin/$SYNC_BRANCH" &&
            [[ "$(git show "origin/$SYNC_BRANCH:.t3-fork/upstream-sync-report.md" 2>/dev/null | sed -n '1p')" == "# T3 Pretty upstream integration report" ]]; then
            echo "Reusing the previously validated AI resolution for $UPSTREAM_TAG."
            export REUSED_SYNC_RESOLUTION=true
            git checkout -B "$SYNC_BRANCH" "origin/$SYNC_BRANCH"
            set +e
            git merge --no-edit origin/main
            merge_status=$?
            set -e
          else
            git checkout -B "$SYNC_BRANCH" origin/main
            set +e
            git merge --no-ff --no-commit "$UPSTREAM_TAG"
            merge_status=$?
            set -e
          fi

          # The fork owns its release and security automation. Keep those files
          # pinned to fork main instead of allowing an upstream tag to rewrite
          # workflows or requiring a broadly scoped personal token.
          git restore --source=origin/main --staged --worktree -- .github/workflows

          mapfile -d '' -t resolver_paths < <(git diff --name-only --diff-filter=U -z)
          if (( ${#resolver_paths[@]} == 0 )) && (( merge_status != 0 )) &&
            ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "Merge failed without producing resolvable conflicts." >&2
            exit "$merge_status"
          fi
          # Always write the durable integration report. Clean merges make no
          # model request; conflict merges use Sol/xhigh and record every
          # parent change intentionally omitted to protect T3 Pretty.
          node scripts/fork/resolve-git-conflicts.mjs

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved merge conflicts remain." >&2
            exit 1
          fi

          mkdir -p .t3-fork
          printf '%s\n' "$UPSTREAM_TAG" > .t3-fork/upstream-nightly
          git add .t3-fork/upstream-nightly
          # Incoming patch payloads can intentionally encode trailing whitespace.
          # Check only files authored by the resolver or this workflow, rather
          # than rejecting untouched content from a trusted upstream release.
          git diff --check --cached -- \
            "${resolver_paths[@]}" \
            .t3-fork/upstream-nightly \
            .t3-fork/upstream-sync-report.md

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "chore(sync): merge upstream $UPSTREAM_TAG"
          elif ! git diff --cached --quiet; then
            git commit -m "chore(sync): record upstream $UPSTREAM_TAG"
          else
            echo "Nothing changed after resolving $UPSTREAM_TAG."
          fi

          remote_head="$(git rev-parse -q --verify "origin/$SYNC_BRANCH" 2>/dev/null || true)"
          if [[ "$(git rev-parse HEAD)" == "$remote_head" ]]; then
            echo "$SYNC_BRANCH is already current."
          else
            git push --force-with-lease origin "HEAD:refs/heads/$SYNC_BRANCH"
          fi

      - id: pull_request
        name: Validate and merge sync pull request
        if: steps.discover.outputs.has_update == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.discover.outputs.tag }}
          SYNC_BRANCH: ${{ steps.discover.outputs.branch }}
        run: |
          set -euo pipefail
          pr_body_path="$RUNNER_TEMP/t3-pretty-upstream-sync.md"
          {
            printf '%s\n\n' \
              'Automated four-hour integration of the newest parent T3 Code nightly into T3 Pretty.' \
              'Clean merges are retained directly. Text conflicts are resolved through CLIProxyAPI with gpt-5.6-sol at xhigh reasoning under the T3 Pretty preservation contract.'
            cat .t3-fork/upstream-sync-report.md
          } > "$pr_body_path"
          pr_number="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open \
            -f base=main \
            -f head="$GITHUB_REPOSITORY_OWNER:$SYNC_BRANCH" \
            --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" \
              -f base=main \
              -f head="$SYNC_BRANCH" \
              -f title="chore(sync): merge upstream $UPSTREAM_TAG" \
              -F "body=@$pr_body_path" \
              --jq '.number')"
          else
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr_number" \
              -F "body=@$pr_body_path" >/dev/null
          fi
          pr_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$pr_number"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

          mobile_release_needed=false
          if ! git diff --quiet origin/main...HEAD -- \
            apps/mobile \
            packages \
            patches \
            pnpm-lock.yaml; then
            mobile_release_needed=true
          fi

          head_sha="$(git rev-parse HEAD)"
          merge_state=""
          for _ in {1..12}; do
            merge_state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq '.mergeable_state')"
            if [[ "$merge_state" == "clean" || "$merge_state" == "unstable" ]]; then
              break
            fi
            sleep 5
          done
          [[ "$merge_state" == "clean" || "$merge_state" == "unstable" ]] || {
            echo "Pull request remained $merge_state after CI statuses were published." >&2
            exit 1
          }

          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr_number/merge" \
            -f merge_method=merge \
            -f sha="$head_sha" \
            --jq 'if .merged then .message else error(.message) end'
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$SYNC_BRANCH" || true

          # GITHUB_TOKEN-authored merges do not reliably emit recursive push
          # workflows, so dispatch the release explicitly. The release workflow
          # is commit-idempotent if a normal push event also arrives.
          gh workflow run fork-release.yml -R "$GITHUB_REPOSITORY" --ref main
          if [[ "$mobile_release_needed" == "true" ]]; then
            gh workflow run fork-mobile-release.yml \
              -R "$GITHUB_REPOSITORY" \
              --ref main \
              -f mode=release \
              -f platform=ios \
              -f message="Upstream sync $UPSTREAM_TAG"
          else
            echo "The upstream integration changed no mobile-relevant paths; skipping mobile release."
          fi

      - name: Report blocked sync
        if: failure() && steps.discover.outputs.has_update == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.discover.outputs.tag }}
        run: |
          title="Upstream sync blocked: $UPSTREAM_TAG"
          existing="$(gh api --method GET "repos/$GITHUB_REPOSITORY/issues" \
            -f state=open \
            -f per_page=100 \
            --jq ".[] | select(.pull_request == null and .title == \"$title\") | .number" | head -n 1)"
          body="The guarded four-hour T3 Pretty sync could not safely merge $UPSTREAM_TAG. Inspect the failed run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ -n "$existing" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$existing/comments" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -f body="$body" >/dev/null
          fi
