name: T3 Pretty Upstream Sync

# Origin is the fork's forge. Parent T3 Code nightlies still live on GitHub
# (pingdotgg/t3code); this workflow fetches those tags, then opens and merges
# the integration pull request on Cursor Origin.
# See docs/operations/fork-release.md.

on:
  workflow_dispatch:
  schedule:
    # Six checks per day keep the fork close to the newest upstream nightly.
    - cron: "0 */4 * * *"

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false
  queue: max

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    name: Sync newest upstream nightly
    if: github.repository != 'SergeSerb2/t3-pretty'
    # macos-release can resolve CURSOR_API_KEY and CLI_PROXY_API_KEY.
    # Hosted Linux cannot resolve CURSOR_API_KEY.
    runs-on: macos-latest
    # A backlog merge resolves dozens of conflicts in sequential model
    # batches; 45 minutes hard-killed those runs mid-resolution, which
    # discarded the work and let the next nightly pile on more conflicts.
    timeout-minutes: 120
    env:
      # Completed per-file resolutions are checkpointed to this branch so a
      # failed or timed-out run's model work survives into the next run.
      RESOLUTION_CACHE_BRANCH: automation/sync-resolution-cache
      # Fail instead of hanging if Origin HTTPS cannot load credentials.
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Prepare macOS runner PATH
        # GHA's `shell: bash` is /bin/bash 3.2. Homebrew node and origin live
        # under /opt/homebrew/bin, which that login-less PATH does not include.
        # A step-local `export PATH` does not survive to later steps. Persist
        # through GITHUB_PATH when the importer sets it, GITHUB_ENV when that
        # file exists, and always t3-pretty-ci.env. Later steps source
        # macos-ci-prelude.sh because the importer often sets GITHUB_PATH
        # without applying it.
        shell: bash
        run: |
          set -euo pipefail
          extra="/opt/homebrew/bin:/opt/homebrew/sbin:${HOME}/.vite-plus/bin:${HOME}/.local/bin"
          export PATH="${extra}:${PATH}"
          if [[ -n "${GITHUB_PATH:-}" ]]; then
            {
              echo "/opt/homebrew/bin"
              echo "/opt/homebrew/sbin"
              echo "${HOME}/.vite-plus/bin"
              echo "${HOME}/.local/bin"
            } >> "$GITHUB_PATH" || true
          fi
          if [[ -n "${GITHUB_ENV:-}" ]]; then
            echo "PATH=${PATH}" >> "$GITHUB_ENV" || true
          fi
          dir="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          dir="${dir%/}"
          workspace="${GITHUB_WORKSPACE:-}"
          workspace="${workspace%/}"
          if [[ -n "$workspace" && "$dir" == "$workspace" ]]; then
            echo "RUNNER_TEMP is the workspace root; writing t3-pretty-ci.env under /tmp"
            dir="/tmp"
          fi
          mkdir -p "$dir" || dir="/tmp"
          ci_env="${dir}/t3-pretty-ci.env"
          rm -f "$ci_env" || true
          printf 'export PATH=%q\n' "$PATH" > "$ci_env" || true

      - name: Checkout fork main
        shell: bash
        run: |
          set -euo pipefail
          helper="/opt/homebrew/etc/buildkite-agent/checkout-origin.sh"
          test -x "$helper"
          "$helper" main --full

      - name: Load Buildkite cluster secrets
        shell: bash
        run: |
          set -euo pipefail
          . scripts/fork/macos-ci-prelude.sh
          . scripts/fork/load-buildkite-secrets.sh CURSOR_API_KEY CLI_PROXY_API_KEY

      - name: Sync newest upstream nightly
        shell: bash
        env:
          ORIGIN_REPO: serbinenko/t3-pretty
          RESOLUTION_CACHE_BRANCH: automation/sync-resolution-cache
        run: |
          set -euo pipefail
          . scripts/fork/macos-ci-prelude.sh
          # One script owns discover, merge, checkpoint, and the Origin PR.
          # Split GHA steps wrote $GITHUB_OUTPUT; the macos-release importer
          # often omits that file, and set -u then died in discover (~2s).
          bash scripts/fork/run-upstream-sync.sh
