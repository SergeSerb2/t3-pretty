name: T3 Pretty Desktop Release

# Origin is the fork's forge and updater host. GitHub Releases are not used.
# Signed Mac/Windows installers are the native macos-release and
# windows-release steps in .buildkite/pipeline.yml. This imported workflow
# only resolves the fork version, writes What's New notes, and compiles the
# WSL node-pty smoke binary on hosted Linux.
#
# Do not add `uses:` steps. Buildkite's importer resolves every action from
# api.github.com at parse time, including jobs that later skip, and a burst
# of main merges then fails the whole workflow with "GitHub API rate limit
# exceeded" before any step runs.
# See docs/operations/fork-release.md.

on:
  push:
    branches:
      - main
    # Path filters stay in the preflight job. Buildkite's GitHub Actions
    # importer rejects on.push.paths, and workflow_dispatch / sync dispatch
    # must still always run.
  workflow_dispatch:

permissions:
  contents: write

# Buildkite's GitHub Actions importer does not copy pipeline `env:` into
# imported jobs. Public feed values have to live here as literals.
env:
  T3CODE_DESKTOP_UPDATE_FEED_URL: "https://pub-8033bcab5baf492b81c605581ff028e0.r2.dev/t3-pretty/latest/"
  T3CODE_RELEASE_S3_BUCKET: t3-pretty-releases
  T3CODE_RELEASE_S3_ENDPOINT: "https://a6f705b8c6459d937d32d31555f9fbf6.r2.cloudflarestorage.com"
  T3CODE_RELEASE_S3_REGION: auto
  APPLE_TEAM_ID: "78A5P57U23"
  T3CODE_APPLE_TEAM_ID: "78A5P57U23"

# Versions stay monotonic, so desktop releases still queue one at a time.
# Preflight and the WSL node-pty compile run on hosted ubuntu-latest and do
# not occupy m1-dev. Packaging stays on the native Mac and Windows agents.
concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve T3 Pretty release
    continue-on-error: true
    # contents: write so the changelog step can push the generated release
    # notes commit. The GITHUB_TOKEN push does not retrigger this workflow.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # Headroom above the changelog generator's 10-minute model budget so a
    # stalled CLIProxy request can never get the preflight hard-killed.
    timeout-minutes: 15
    outputs:
      should_release: ${{ steps.tags.outputs.can_mint == 'true' && steps.paths.outputs.relevant == 'true' && steps.existing.outputs.should_release == 'true' && steps.signing.outputs.configured == 'true' }}
      windows_release: ${{ steps.signing.outputs.windows || 'false' }}
      windows_signed: ${{ steps.signing.outputs.windows_signed || 'false' }}
      version: ${{ steps.release.outputs.version || '-' }}
      tag: ${{ steps.release.outputs.tag || '-' }}
      name: ${{ steps.release.outputs.name || '-' }}
      upstream_tag: ${{ steps.release.outputs.upstream_tag || '-' }}
      ref: ${{ steps.changelog.outputs.ref || github.sha || '-' }}
    steps:
      - name: Use the importer checkout
        shell: bash
        run: |
          set -euo pipefail
          # Hosted linux-small GHA workspaces often have no .git. Do not
          # call checkout@v6 (importer rate-limit). Prefer the parent
          # Buildkite checkout; Origin HTTPS has no hosted credentials.
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            sha="${GITHUB_SHA:-${BUILDKITE_COMMIT:-}}"
            url="${BUILDKITE_REPO:-https://origin.cursor.com/serbinenko/t3-pretty.git}"
            echo "Importer left no git checkout; cloning ${sha:-HEAD}"
            git init
            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "$url"
            else
              git remote add origin "$url"
            fi
            if [[ -n "${BUILDKITE_BUILD_CHECKOUT_PATH:-}" && -d "${BUILDKITE_BUILD_CHECKOUT_PATH}/.git" ]]; then
              git fetch "${BUILDKITE_BUILD_CHECKOUT_PATH}" "${sha:-HEAD}" &&
                git -c advice.detachedHead=false checkout --force FETCH_HEAD || true
            fi
            if ! git rev-parse --verify HEAD >/dev/null 2>&1 && [[ -n "$sha" ]]; then
              git fetch --depth 1 origin "$sha" &&
                git -c advice.detachedHead=false checkout --force FETCH_HEAD || true
            fi
            if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
              echo "Could not clone the triggering SHA; later steps skip mint."
              exit 0
            fi
          fi
          git fetch --force --prune --unshallow origin || git fetch --force --prune origin || true
          if [[ -n "${GITHUB_SHA:-}" ]] && git cat-file -e "${GITHUB_SHA}^{commit}" 2>/dev/null; then
            git checkout --force "$GITHUB_SHA"
          fi

      - id: paths
        name: Skip desktop-irrelevant pushes
        shell: bash
        run: |
          set -euo pipefail
          gha_out() {
            if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
              printf '%s\n' "$1" >> "$GITHUB_OUTPUT" || true
            fi
          }
          if ! git rev-parse --verify --quiet HEAD >/dev/null; then
            echo "No git checkout; skipping imported preflight."
            gha_out "relevant=false"
            exit 0
          fi
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]] || ! git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            gha_out "relevant=true"
            exit 0
          fi
          if git diff --quiet HEAD~1 HEAD -- \
            apps/desktop \
            apps/web \
            apps/server \
            packages \
            patches \
            scripts \
            native \
            assets \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            vite.config.ts \
            tsconfig.base.json \
            t3.json \
            .github/workflows/fork-release.yml \
            .buildkite; then
            echo "Push does not change the shipped desktop app."
            gha_out "relevant=false"
          else
            gha_out "relevant=true"
          fi

      - id: tags
        name: Fetch upstream release tags
        if: steps.paths.outputs.relevant == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gha_out() {
            if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
              printf '%s\n' "$1" >> "$GITHUB_OUTPUT" || true
            fi
          }
          skip_mint() {
            echo "$1" >&2
            gha_out "can_mint=false"
            exit 0
          }
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/pingdotgg/t3code.git
          else
            git remote add upstream https://github.com/pingdotgg/t3code.git
          fi
          git fetch --force --tags upstream || skip_mint "Could not fetch upstream tags; skipping imported version mint."
          # Fork versions must stay above every already-pushed Origin tag.
          # Hosted linux-small often cannot fetch Origin tags (no credentials).
          # Native Mac/Windows packagers fetch tags themselves. Do not fail
          # this imported job: skip minting so the Buildkite build stays
          # green and native packagers still resolve the version.
          origin_tags_ok=1
          git fetch --force --tags origin || origin_tags_ok=0
          if [[ "$origin_tags_ok" != 1 ]]; then
            echo "::warning::Could not fetch Origin fork tags from the origin remote."
            if [[ -z "$(git tag --list 'v*-nightly.*.fork')" ]]; then
              skip_mint "No fork tags are present; refusing to mint a version."
            fi
          fi
          gha_out "can_mint=true"

      - id: existing
        name: Skip an already released commit
        if: steps.paths.outputs.relevant == 'true' && steps.tags.outputs.can_mint == 'true'
        shell: bash
        run: |
          existing_tag="$(
            git tag --points-at HEAD \
              --list 'fork-v*' \
              --list 'v*-nightly.*.fork' \
              --sort=-version:refname | head -n 1
          )"
          if [[ -z "$existing_tag" ]]; then
            # A run that generated What's New notes tags the changelog child
            # commit instead of the triggering commit; recognize that child so
            # re-running a completed Actions run still skips the release.
            head_sha="$(git rev-parse HEAD)"
            for tag in $(git tag --list 'v*-nightly.*.fork' --sort=-version:refname); do
              if [[ "$(git rev-parse --verify --quiet "$tag^{commit}~1")" == "$head_sha" ]] &&
                [[ "$(git log -1 --format=%s "$tag^{commit}")" == "docs(changelog):"* ]]; then
                existing_tag="$tag"
                break
              fi
            done
          fi
          if [[ -n "$existing_tag" ]]; then
            echo "Commit already has fork release $existing_tag."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Origin release publisher credentials
        if: steps.tags.outputs.can_mint == 'true' && steps.existing.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          # Read Buildkite pipeline env directly. Mapping `${{ env.NAME }}`
          # here overwrites those values with empty GHA context.
          # Hosted Linux cannot resolve CURSOR_API_KEY. Origin CLI login
          # happens on macos-release during publish.
          test -n "${T3CODE_DESKTOP_UPDATE_FEED_URL:-}"
          test -n "${T3CODE_RELEASE_S3_BUCKET:-}"
          case "$T3CODE_DESKTOP_UPDATE_FEED_URL" in
            *github.com*)
              echo "T3CODE_DESKTOP_UPDATE_FEED_URL still points at GitHub." >&2
              exit 1
              ;;
          esac

      - id: signing
        name: Check updater signing credentials
        if: steps.tags.outputs.can_mint == 'true' && steps.existing.outputs.should_release == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ env.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ env.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ env.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ env.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || env.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ env.MACOS_PROVISIONING_PROFILE }}
          AZURE_TENANT_ID: ${{ env.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ env.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ env.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ env.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ env.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          # The importer does not pass BUILDKITE=* or Mac signing secrets
          # into this hosted job. macos-release still receives the
          # certificate secrets and fails the release if they are missing.
          if [[ -z "${CSC_LINK:-}" ]]; then
            echo "Mac signing secrets are resolved on macos-release, not this hosted job."
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'windows_signed=false' >> "$GITHUB_OUTPUT"
            echo 'windows=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # macOS signing is the release floor. Windows signing is optional:
          # unsigned NSIS installers still auto-update from the public Origin
          # feed. When Azure Trusted Signing is not configured the release still
          # ships Windows. MACOS_PROVISIONING_PROFILE
          # is optional; without it the build sets
          # T3CODE_MACOS_SKIP_PASSKEY_PROFILE and passkey login degrades.
          mac_required=(
            CSC_LINK
            CSC_KEY_PASSWORD
            APPLE_API_KEY
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
            APPLE_TEAM_ID
          )
          win_required=(
            AZURE_TENANT_ID
            AZURE_CLIENT_ID
            AZURE_CLIENT_SECRET
            AZURE_TRUSTED_SIGNING_ENDPOINT
            AZURE_TRUSTED_SIGNING_ACCOUNT_NAME
            AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME
            AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          missing_mac=()
          for name in "${mac_required[@]}"; do
            [[ -n "${!name:-}" ]] || missing_mac+=("$name")
          done
          missing_win=()
          for name in "${win_required[@]}"; do
            [[ -n "${!name:-}" ]] || missing_win+=("$name")
          done
          if (( ${#missing_mac[@]} > 0 )); then
            printf 'Skipping updater release because macOS signing is not configured. Missing: %s\n' "${missing_mac[*]}"
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
          if (( ${#missing_win[@]} > 0 )); then
            printf 'Windows signing is not configured; shipping an unsigned Windows updater. Missing: %s\n' "${missing_win[*]}"
            echo 'windows_signed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'windows_signed=true' >> "$GITHUB_OUTPUT"
          fi
          echo 'windows=true' >> "$GITHUB_OUTPUT"

      - name: Ensure Node
        if: steps.tags.outputs.can_mint == 'true' && steps.existing.outputs.should_release == 'true' && steps.signing.outputs.configured == 'true'
        shell: bash
        run: bash scripts/fork/ensure-linux-node.sh

      - id: release
        name: Create a monotonic fork version
        continue-on-error: true
        if: steps.tags.outputs.can_mint == 'true' && steps.existing.outputs.should_release == 'true' && steps.signing.outputs.configured == 'true'
        env:
          T3_SKIP_UNRESOLVABLE_MINT: "1"
        run: node scripts/fork/resolve-fork-release.mjs

      - id: changelog
        name: Generate What's New changelog entries
        # main only: a manual dispatch of another ref must not push its
        # history to main.
        if: >-
          steps.tags.outputs.can_mint == 'true' &&
          steps.existing.outputs.should_release == 'true' &&
          steps.signing.outputs.configured == 'true' &&
          github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          CLI_PROXY_API_KEY: ${{ env.CLI_PROXY_API_KEY }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        # Writes one What's New entry per shipped fork build — the fork's own
        # changes plus the integrated parent nightly — for every build missing
        # an entry, then commits and pushes so this release ships its own
        # notes. Failures downgrade to warnings and never block the release;
        # the next run regenerates whatever is missing.
        run: node scripts/fork/generate-changelog.mjs

  # Only GHA job that needs preflight. Native DMG/NSIS/relay mint versions
  # themselves in .buildkite/pipeline.yml and do not read these outputs.
  build_wsl_node_pty:
    name: Build WSL node-pty (linux-x64)
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.should_release == 'true' && needs.preflight.outputs.windows_release == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Use the importer checkout
        shell: bash
        env:
          PREFLIGHT_REF: ${{ needs.preflight.outputs.ref }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            sha="${PREFLIGHT_REF:-${GITHUB_SHA:-${BUILDKITE_COMMIT:-}}}"
            url="${BUILDKITE_REPO:-https://origin.cursor.com/serbinenko/t3-pretty.git}"
            echo "Importer left no git checkout; cloning ${sha:-HEAD}"
            git init
            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "$url"
            else
              git remote add origin "$url"
            fi
            if [[ -n "${BUILDKITE_BUILD_CHECKOUT_PATH:-}" && -d "${BUILDKITE_BUILD_CHECKOUT_PATH}/.git" ]]; then
              git fetch "${BUILDKITE_BUILD_CHECKOUT_PATH}" "${sha:-HEAD}" &&
                git -c advice.detachedHead=false checkout --force FETCH_HEAD || true
            fi
            if ! git rev-parse --verify HEAD >/dev/null 2>&1 && [[ -n "$sha" && "$sha" != "-" ]]; then
              git fetch --depth 1 origin "$sha" &&
                git -c advice.detachedHead=false checkout --force FETCH_HEAD || true
            fi
            if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
              echo "Could not clone the triggering SHA for WSL prebuild." >&2
              exit 1
            fi
          fi
          git fetch --force --prune --unshallow origin || git fetch --force --prune origin || true
          ref="${PREFLIGHT_REF:-${GITHUB_SHA:-}}"
          if [[ -z "$ref" || "$ref" == "-" ]]; then
            exit 0
          fi
          if ! git cat-file -e "${ref}^{commit}" 2>/dev/null; then
            git fetch --force origin "$ref" || true
          fi
          if git cat-file -e "${ref}^{commit}" 2>/dev/null; then
            git checkout --force "$ref"
          fi

      - name: Ensure Node
        shell: bash
        run: bash scripts/fork/ensure-linux-node.sh

      - name: Build node-pty Linux prebuild
        shell: bash
        run: |
          set -euo pipefail
          # Native linux/amd64: the previous Mac job compiled this inside
          # qemu/rosetta Docker and serialized with the DMG on m1-dev.
          sudo apt-get update
          # `file` is not on Buildkite hosted linux-small. The ELF check
          # below is how we refuse a Darwin/QEMU binary.
          sudo apt-get install -y python3 make g++ file
          node_pty_version="$(
            node -e "console.log(require('./apps/server/package.json').dependencies['node-pty'].replace(/^[^0-9]*/, ''))"
          )"
          mkdir -p wsl-prebuild "$RUNNER_TEMP/node-pty-build"
          cd "$RUNNER_TEMP/node-pty-build"
          npm init --yes >/dev/null
          npm install --ignore-scripts "node-pty@$node_pty_version"
          ( cd node_modules/node-pty && npx --yes node-gyp rebuild )
          install -m 0644 node_modules/node-pty/build/Release/pty.node \
            "$GITHUB_WORKSPACE/wsl-prebuild/pty.node"
          file "$GITHUB_WORKSPACE/wsl-prebuild/pty.node" | tee /dev/stderr | grep -Eq 'x86[-_]64|ELF 64-bit'
