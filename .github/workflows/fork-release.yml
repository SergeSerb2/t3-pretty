name: T3 Pretty Desktop Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    name: Resolve T3 Pretty release
    permissions:
      contents: read
    runs-on: [self-hosted, macOS, ARM64, t3code-fork, release-only]
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.existing.outputs.should_release == 'true' && steps.signing.outputs.configured == 'true' }}
      windows_release: ${{ steps.signing.outputs.windows }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      name: ${{ steps.release.outputs.name }}
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Fetch upstream release tags
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --force --tags upstream

      - id: existing
        name: Skip an already released commit
        shell: bash
        run: |
          existing_tag="$(
            git tag --points-at HEAD \
              --list 'fork-v*' \
              --list 'v*-nightly.*.fork' \
              --sort=-version:refname | head -n 1
          )"
          if [[ -n "$existing_tag" ]]; then
            echo "Commit already has fork release $existing_tag."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release publisher credential
        if: steps.existing.outputs.should_release == 'true'
        env:
          FORK_RELEASE_TOKEN: ${{ secrets.FORK_RELEASE_TOKEN }}
        run: test -n "$FORK_RELEASE_TOKEN"

      - id: signing
        name: Check updater signing credentials
        if: steps.existing.outputs.should_release == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          # macOS signing is the release floor. Windows signing is optional:
          # when Azure Trusted Signing is not configured the release ships
          # macOS-only instead of skipping entirely. MACOS_PROVISIONING_PROFILE
          # is optional; without it the build sets
          # T3CODE_MACOS_SKIP_PASSKEY_PROFILE and passkey login degrades.
          mac_required=(
            CSC_LINK
            CSC_KEY_PASSWORD
            APPLE_API_KEY
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
            APPLE_TEAM_ID
          )
          win_required=(
            AZURE_TENANT_ID
            AZURE_CLIENT_ID
            AZURE_CLIENT_SECRET
            AZURE_TRUSTED_SIGNING_ENDPOINT
            AZURE_TRUSTED_SIGNING_ACCOUNT_NAME
            AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME
            AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          missing_mac=()
          for name in "${mac_required[@]}"; do
            [[ -n "${!name:-}" ]] || missing_mac+=("$name")
          done
          missing_win=()
          for name in "${win_required[@]}"; do
            [[ -n "${!name:-}" ]] || missing_win+=("$name")
          done
          if (( ${#missing_mac[@]} > 0 )); then
            printf 'Skipping updater release because macOS signing is not configured. Missing: %s\n' "${missing_mac[*]}"
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
          if (( ${#missing_win[@]} > 0 )); then
            printf 'Windows signing is not configured; releasing macOS-only. Missing: %s\n' "${missing_win[*]}"
            echo 'windows=false' >> "$GITHUB_OUTPUT"
          else
            echo 'windows=true' >> "$GITHUB_OUTPUT"
          fi

      - id: release
        name: Create a monotonic fork version
        if: steps.existing.outputs.should_release == 'true' && steps.signing.outputs.configured == 'true'
        run: node scripts/fork/resolve-fork-release.mjs

      - name: Setup release-smoke dependencies
        if: steps.existing.outputs.should_release == 'true' && steps.signing.outputs.configured == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        if: steps.existing.outputs.should_release == 'true' && steps.signing.outputs.configured == 'true'
        run: node scripts/release-smoke.ts

  build_wsl_node_pty:
    name: Build WSL node-pty (linux-x64)
    needs: preflight
    if: needs.preflight.outputs.should_release == 'true' && needs.preflight.outputs.windows_release == 'true'
    permissions:
      contents: read
    runs-on: [self-hosted, macOS, ARM64, t3code-fork, release-only]
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Build node-pty Linux prebuild in an x64 container
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$HOME/.vite-plus/bin:$PATH"
          docker version

          node_pty_version="$(
            node -e "console.log(require('./apps/server/package.json').dependencies['node-pty'].replace(/^[^0-9]*/, ''))"
          )"
          mkdir -p wsl-prebuild
          docker run --rm \
            --platform linux/amd64 \
            --env "NODE_PTY_VERSION=$node_pty_version" \
            --volume "$GITHUB_WORKSPACE/wsl-prebuild:/out" \
            node:24.19.0-bookworm@sha256:f6d02cf1353049cf3658e6ce9ec03c6877a6479495f122062d195e2279d01055 \
            bash -lc '
              set -euo pipefail
              mkdir -p /build
              cd /build
              npm init --yes >/dev/null
              npm install --ignore-scripts "node-pty@$NODE_PTY_VERSION"
              pty_dir=/build/node_modules/node-pty
              ( cd "$pty_dir" && npx --yes node-gyp rebuild )
              install -m 0644 "$pty_dir/build/Release/pty.node" /out/pty.node
            '
          file wsl-prebuild/pty.node | tee /dev/stderr | grep -Eq 'x86[-_]64'

      - name: Upload WSL prebuild
        uses: actions/upload-artifact@v7
        with:
          name: fork-wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  build_macos:
    name: Build macOS arm64
    needs: preflight
    if: needs.preflight.outputs.should_release == 'true'
    permissions:
      contents: read
    runs-on: [self-hosted, macOS, ARM64, t3code-fork, release-only]
    timeout-minutes: 60
    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          clean: true
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Prepare macOS runner PATH
        shell: bash
        run: |
          set -euo pipefail
          rustup_bin_dir="$(dirname "$(command -v rustup)")"
          if [[ ! -x "$rustup_bin_dir/rustc" ]]; then
            rustup_bin_dir="$(brew --prefix rustup)/bin"
          fi
          mkdir -p "$HOME/.cargo/bin"
          for tool in cargo rustc rustdoc rustfmt clippy-driver; do
            test -x "$rustup_bin_dir/$tool"
            ln -sf "$rustup_bin_dir/$tool" "$HOME/.cargo/bin/$tool"
          done
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" +stable --version

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Build macOS updater artifact
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
          VITE_SCENERY_UNSPLASH_KEY: ${{ secrets.VITE_SCENERY_UNSPLASH_KEY }}
        run: |
          set -euo pipefail
          args=(
            --platform mac
            --target dmg
            --arch arm64
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
          )
          required=(
            "$CSC_LINK"
            "$CSC_KEY_PASSWORD"
            "$APPLE_API_KEY"
            "$APPLE_API_KEY_ID"
            "$APPLE_API_ISSUER"
            "$APPLE_TEAM_ID"
          )
          if printf '%s\n' "${required[@]}" | grep -q '^$'; then
            echo "Refusing to build an unsigned macOS updater artifact." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          export APPLE_API_KEY="$key_path"
          export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
          if [[ -n "$MACOS_PROVISIONING_PROFILE" ]]; then
            profile_path="$RUNNER_TEMP/t3code.provisionprofile"
            printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
            export T3CODE_MACOS_PROVISIONING_PROFILE="$profile_path"
          else
            echo "No provisioning profile configured; signed build ships without the passkey entitlement."
            export T3CODE_MACOS_SKIP_PASSKEY_PROFILE=1
          fi
          # electron-builder's own temp-keychain import fails at
          # set-key-partition-list under this runner's launchd session. Prepare
          # the signing keychain the same way the proven SurgeCode release job
          # does on this host, then hand it to electron-builder through
          # CSC_KEYCHAIN/CSC_NAME instead of CSC_LINK.
          signing_keychain="$RUNNER_TEMP/fork-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate_path="$RUNNER_TEMP/DeveloperIDApplication.p12"
          developer_id_g2_path="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          developer_id_g2_sha256="f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a"
          restore_keychains() {
            security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
            security delete-keychain "$signing_keychain" >/dev/null 2>&1 || true
          }
          trap restore_keychains EXIT
          printf '%s' "$CSC_LINK" | tr -d ' \n' | base64 -D > "$certificate_path"
          curl --fail --location --silent --show-error \
            -o "$developer_id_g2_path" \
            "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer"
          printf '%s  %s\n' "$developer_id_g2_sha256" "$developer_id_g2_path" | shasum -a 256 -c -
          security delete-keychain "$signing_keychain" >/dev/null 2>&1 || true
          security create-keychain -p "$keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$keychain_password" "$signing_keychain"
          security import "$developer_id_g2_path" -k "$signing_keychain"
          security import "$certificate_path" -k "$signing_keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S 'apple-tool:,apple:,codesign:' -s -k "$keychain_password" "$signing_keychain" >/dev/null
          security list-keychains -d user -s "$signing_keychain" "$HOME/Library/Keychains/login.keychain-db"
          # electron-builder rejects CSC_NAME values that include the
          # certificate-type prefix.
          identity_name="$(security find-identity -v -p codesigning "$signing_keychain" |
            sed -n 's/.*"Developer ID Application: \([^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity_name" ]]; then
            echo "No valid Developer ID Application identity in the prepared keychain." >&2
            exit 1
          fi
          rm -f "$certificate_path"
          export CSC_KEYCHAIN="$signing_keychain"
          export CSC_NAME="$identity_name"
          unset CSC_LINK CSC_KEY_PASSWORD
          args+=(--signed)
          vp run dist:desktop:artifact "${args[@]}"

      - name: Verify macOS updater signature
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          zip_path="$(find release -maxdepth 1 -type f -name '*-arm64.zip' -print -quit)"
          test -n "$zip_path"
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          ditto -x -k "$zip_path" "$verify_dir"
          app_path="$(find "$verify_dir" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature_details="$(codesign -d --verbose=4 "$app_path" 2>&1)"
          team_identifier="$(sed -n 's/^TeamIdentifier=//p' <<< "$signature_details")"
          [[ "$team_identifier" == "$APPLE_TEAM_ID" ]]

      - name: Collect macOS release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          find release -maxdepth 1 -type f \( \
            -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name '*.yml' \
          \) -exec cp {} release-publish/ \;

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fork-desktop-mac-arm64
          path: release-publish/*
          if-no-files-found: error

  build_windows:
    name: Build Windows x64
    needs: [preflight, build_wsl_node_pty]
    if: needs.preflight.outputs.should_release == 'true' && needs.preflight.outputs.windows_release == 'true' && needs.build_wsl_node_pty.result == 'success'
    permissions:
      contents: read
    runs-on: [self-hosted, Windows, X64, t3code-fork, release-only]
    timeout-minutes: 60
    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          clean: true
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Prepare Windows runner PATH
        shell: powershell
        run: |
          $pwshDir = Join-Path $env:ProgramFiles "PowerShell\7"
          $gitBashDir = Join-Path $env:ProgramFiles "Git\bin"
          if (-not (Test-Path (Join-Path $pwshDir "pwsh.exe"))) {
            throw "PowerShell 7 is required at $pwshDir"
          }
          if (-not (Test-Path (Join-Path $gitBashDir "bash.exe"))) {
            throw "Git for Windows Bash is required at $gitBashDir"
          }
          $pwshDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # Composite actions request `shell: bash`. Put Git Bash ahead of the
          # Windows WSL launcher so they do not require a local WSL distro.
          $gitBashDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download WSL prebuild
        uses: actions/download-artifact@v8
        with:
          name: fork-wsl-node-pty-x64
          path: wsl-prebuild

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Build Windows updater artifact
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          VITE_SCENERY_UNSPLASH_KEY: ${{ secrets.VITE_SCENERY_UNSPLASH_KEY }}
        run: |
          set -euo pipefail
          args=(
            --platform win
            --target nsis
            --arch x64
            --build-version "${{ needs.preflight.outputs.version }}"
            --wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node"
            --verbose
          )
          required=(
            "$AZURE_TENANT_ID"
            "$AZURE_CLIENT_ID"
            "$AZURE_CLIENT_SECRET"
            "$AZURE_TRUSTED_SIGNING_ENDPOINT"
            "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME"
            "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME"
            "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME"
          )
          if printf '%s\n' "${required[@]}" | grep -q '^$'; then
            echo "Refusing to build an unsigned Windows updater artifact." >&2
            exit 1
          fi
          args+=(--signed)
          vp run dist:desktop:artifact "${args[@]}"

      - name: Verify Windows updater signature
        shell: powershell
        run: |
          $installer = Get-ChildItem release -File -Filter '*-x64.exe' |
            Where-Object { $_.Name -notlike '*uninstaller*' } |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw 'No Windows updater installer was produced.'
          }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Windows updater signature is $($signature.Status): $($signature.StatusMessage)"
          }

      - name: Collect Windows release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          find release -maxdepth 1 -type f \( \
            -name '*.exe' -o -name '*.blockmap' -o -name '*.yml' \
          \) -exec cp {} release-publish/ \;

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fork-desktop-win-x64
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish T3 Pretty updater release
    needs: [preflight, build_macos, build_windows]
    if: >-
      !cancelled() &&
      needs.preflight.outputs.should_release == 'true' &&
      needs.build_macos.result == 'success' &&
      (needs.build_windows.result == 'success' || needs.build_windows.result == 'skipped')
    runs-on: [self-hosted, macOS, ARM64, t3code-fork, release-only]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup manifest tooling
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: fork-desktop-*
          merge-multiple: true
          path: release-assets

      - name: Verify updater manifests
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          HAS_WINDOWS: ${{ needs.build_windows.result == 'success' }}
        run: |
          set -euo pipefail
          mac_manifest="$(find release-assets -maxdepth 1 -name '*-mac.yml' -print -quit)"
          test -n "$mac_manifest"
          win_manifest=""
          if [[ "$HAS_WINDOWS" == "true" ]]; then
            win_manifest="$(find release-assets -maxdepth 1 -name 'nightly.yml' -print -quit)"
            test -n "$win_manifest"
          fi
          node --input-type=module - "$mac_manifest" "$win_manifest" "$RELEASE_VERSION" <<'NODE'
          import fs from "node:fs";
          import { parseUpdateManifest } from "./scripts/lib/update-manifest.ts";

          const [macPath, winPath, expectedVersion] = process.argv.slice(2);
          const mac = parseUpdateManifest(fs.readFileSync(macPath, "utf8"), macPath, "macOS");
          const win = winPath
            ? parseUpdateManifest(fs.readFileSync(winPath, "utf8"), winPath, "Windows")
            : undefined;

          const manifests = [["macOS", mac], ...(win ? [["Windows", win]] : [])];
          for (const [platform, manifest] of manifests) {
            if (manifest.version !== expectedVersion) {
              throw new Error(`${platform} manifest version ${manifest.version} != ${expectedVersion}`);
            }
          }

          const macUrls = mac.files?.map((file) => file.url) ?? [];
          if (!macUrls.some((url) => url.endsWith("-arm64.zip"))) {
            throw new Error("macOS manifest is missing the arm64 zip");
          }
          if (win && !(win.files?.some((file) => file.url.endsWith("-x64.exe")) ?? false)) {
            throw new Error("Windows manifest is missing the x64 installer");
          }
          NODE
          mac_zip="$(find release-assets -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$mac_zip"
          unzip -p "$mac_zip" '*/Contents/Resources/app-update.yml' > app-update.yml
          grep -F 'owner: SergeSerb2' app-update.yml
          grep -F 'repo: t3code-fork-theme' app-update.yml

      - name: Publish public GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_REF: ${{ needs.preflight.outputs.ref }}
          RELEASE_NAME: ${{ needs.preflight.outputs.name }}
          UPSTREAM_TAG: ${{ needs.preflight.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
          )
          (( ${#assets[@]} > 0 ))
          release_notes_path="$RUNNER_TEMP/t3-pretty-release-notes.md"
          {
            printf \
              'T3 Pretty build from `%s`.\nIncludes parent T3 Code through `%s` plus all changes merged to T3 Pretty `main`.\n' \
              "$RELEASE_REF" "$UPSTREAM_TAG"
            if [[ -s .t3-fork/upstream-sync-report.md ]]; then
              printf '\n'
              cat .t3-fork/upstream-sync-report.md
            else
              printf '\nNo parent integration report is present for this revision.\n'
            fi
          } > "$release_notes_path"
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_REF" \
            --title "$RELEASE_NAME" \
            --notes-file "$release_notes_path" \
            --prerelease \
            --latest=false
