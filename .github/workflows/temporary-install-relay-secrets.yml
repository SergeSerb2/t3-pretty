name: Temporary install relay secrets

# One-shot: write production relay secrets onto the macos-release file store.
# Delete this workflow after it succeeds.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: temporary-install-relay-secrets
  cancel-in-progress: false

jobs:
  install:
    if: github.actor == 'SergeSerb2'
    runs-on: [self-hosted, macOS, ARM64, t3code-fork, release-only]
    environment: production
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
      PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
      AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
      APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Write macos-release file store
        shell: bash
        run: |
          set -euo pipefail
          dests=(
            "${HOME}/.config/t3-pretty"
            /Users/m1-dev/.config/t3-pretty
            /opt/homebrew/var/buildkite-agent/secrets
          )
          for dest in "${dests[@]}"; do
            mkdir -p "$dest"
          done
          for name in \
            CLERK_SECRET_KEY \
            PLANETSCALE_API_TOKEN_ID \
            PLANETSCALE_API_TOKEN \
            AXIOM_TOKEN \
            APNS_PRIVATE_KEY \
            CLOUDFLARE_API_TOKEN
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production secret: $name" >&2
              exit 1
            fi
            for dest in "${dests[@]}"; do
              printf '%s' "${!name}" > "$dest/$name"
              chmod 600 "$dest/$name"
            done
            echo "installed $name"
          done
