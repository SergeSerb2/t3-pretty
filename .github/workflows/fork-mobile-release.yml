name: T3 Pretty Mobile Release

# Production iOS binaries compile on the fork's self-hosted Macs. That avoids
# Expo's cloud iOS quota ($2/build on paid plans, 15/month on free). OTA
# updates and TestFlight upload still use the fork-owned EAS project; those
# are not iOS cloud builds.
#
# OTA publishing and the native-fingerprint decision run on GitHub-hosted
# ubuntu-latest (free for this public repo) so they never wait for m1-dev.
# Xcode runs only when the fingerprint changed, or when a maintainer
# dispatches `build` / force_ios. JS-only releases therefore never occupy
# the Mac.
#
# Origin is the fork's forge. OTA still publishes through Expo; the
# fingerprint record lands through an Origin pull request.
# See docs/operations/fork-mobile-release.md.
on:
  push:
    branches: [main]
    # Path filters stay in the OTA job. Buildkite's GitHub Actions importer
    # rejects on.push.paths; workflow_dispatch and sync dispatch still run.
  workflow_dispatch:
    inputs:
      mode:
        description: "release (OTA + iOS TestFlight if native changed), build, or update (OTA only)"
        required: true
        type: choice
        default: release
        options:
          - release
          - build
          - update
      platform:
        description: "OTA target platform. Native binaries are iOS-only and always local."
        required: true
        type: choice
        default: ios
        options:
          - ios
          - android
          - all
      message:
        description: "OTA update message (release or update mode)"
        required: false
        type: string
      force_ios:
        description: "Compile and submit a TestFlight IPA even when the native fingerprint is unchanged"
        required: false
        type: boolean
        default: false

concurrency:
  group: fork-mobile-release
  cancel-in-progress: false

# Buildkite's importer does not copy pipeline `env:` or GitHub `vars.*`.
# Public Expo/EAS IDs have to live here as literals.
env:
  T3CODE_MOBILE_UPDATE_URL: "https://u.expo.dev/1eb51d67-48c5-4100-8aa8-f5ac9e1ada65"
  T3CODE_MOBILE_EAS_PROJECT_ID: "1eb51d67-48c5-4100-8aa8-f5ac9e1ada65"
  T3CODE_MOBILE_EXPO_OWNER: sergeserbinenkoteam
  T3CODE_MOBILE_EXPO_SLUG: t3-pretty
  T3CODE_APPLE_TEAM_ID: "78A5P57U23"
  T3CODE_IOS_SHARE_EXTENSION: "0"
  APPLE_TEAM_ID: "78A5P57U23"

jobs:
  ota:
    name: Publish OTA (${{ github.event_name == 'push' && 'release' || inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.paths.outputs.relevant == 'true' && steps.native.outputs.should_build }}
      fingerprint: ${{ steps.native.outputs.fingerprint }}
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      MODE: ${{ github.event_name == 'push' && 'release' || inputs.mode }}
      PLATFORM: ${{ github.event_name == 'push' && 'all' || inputs.platform }}
      FORCE_IOS: ${{ github.event_name == 'workflow_dispatch' && inputs.force_ios || false }}
    steps:
      - id: expo-token
        name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "EXPO_TOKEN is required for OTA publishing and managed iOS credentials." >&2
            exit 1
          fi

      - name: Checkout
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          clean: true
          # No sparse-checkout here: it makes actions/checkout fetch with
          # --filter=blob:none, and eas-cli archives the project via
          # `git clone --depth 1 file://<workspace>`, which fails (exit 128)
          # when the partial clone can't serve the unfetched blobs.

      - id: paths
        name: Skip mobile-irrelevant pushes
        if: steps.expo-token.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]] || ! git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet HEAD~1 HEAD -- \
            apps/mobile \
            packages \
            patches \
            pnpm-lock.yaml \
            .github/workflows/fork-mobile-release.yml \
            scripts/fork/resolve-ios-native-build.mjs \
            scripts/fork/security-eas-local-keychain \
            scripts/fork/origin-forge.mjs; then
            echo "Push does not change mobile-relevant paths."
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Vite+
        if: steps.expo-token.outputs.present == 'true' && steps.paths.outputs.relevant == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
              - --filter=@t3tools/scripts...

      - name: Expose pnpm
        if: steps.expo-token.outputs.present == 'true' && steps.paths.outputs.relevant == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        if: steps.expo-token.outputs.present == 'true' && steps.paths.outputs.relevant == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # npm, not pnpm: this only installs eas-cli into the action's own
          # tool dir, and pnpm 11 hard-fails that install on dtrace-provider's
          # ignored build script (no allowBuilds config outside the repo).
          packager: npm

      - name: Pull production environment variables
        if: steps.expo-token.outputs.present == 'true' && steps.paths.outputs.relevant == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # app.config.ts reads the repository-root env files, not apps/mobile/.env.local.
        # Local EAS builds pack a gitignore-filtered copy, so also export the
        # pulled values into the job environment for child processes.
        run: |
          set -euo pipefail
          eas env:pull production --path ../../.env.local --non-interactive
          if [[ -f ../../.env.local ]]; then
            grep -vE '^[[:space:]]*(#|$)' ../../.env.local >> "$GITHUB_ENV"
          fi

      - name: Publish OTA update
        if: steps.expo-token.outputs.present == 'true' && steps.paths.outputs.relevant == 'true' && (env.MODE == 'update' || env.MODE == 'release')
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          update_platform="$PLATFORM"
          if [[ "$MODE" == "release" ]]; then
            update_platform=all
          fi
          eas update \
            --channel production \
            --environment production \
            --platform "$update_platform" \
            --message "${{ inputs.message || format('Production OTA ({0})', github.sha) }}" \
            --non-interactive

      - id: native
        name: Decide whether a new iOS binary is required
        if: steps.expo-token.outputs.present == 'true' && steps.paths.outputs.relevant == 'true' && (env.MODE == 'build' || env.MODE == 'release')
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "build" && "$PLATFORM" == "android" ]]; then
            echo "Native Android cloud builds are retired. iOS compiles locally on the Mac runner; Android store binaries are not wired yet." >&2
            exit 1
          fi

          fingerprint_file="$RUNNER_TEMP/ios-fingerprint.json"
          builds_file="$RUNNER_TEMP/ios-builds.json"
          if ! eas fingerprint:generate \
            --platform ios \
            --build-profile production \
            --json \
            --non-interactive > "$fingerprint_file"; then
            echo "Could not generate the iOS fingerprint; building a native binary to be safe."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Do not filter to finished builds alone. A follow-up push can
          # otherwise miss an identical production build that is still new,
          # queued, or in progress and start another paid compile. Local builds
          # hold the workflow concurrency lock, but hosted builds (manual or
          # historical) do not, so the gate must see in-flight records too.
          if ! eas build:list \
            --platform ios \
            --build-profile production \
            --distribution store \
            --limit 20 \
            --json \
            --non-interactive > "$builds_file"; then
            echo "[]" > "$builds_file"
          fi

          submitted_fingerprint=""
          if [[ -f ../../.t3-fork/ios-production-fingerprint ]]; then
            submitted_fingerprint="$(tr -d '[:space:]' < ../../.t3-fork/ios-production-fingerprint)"
          fi
          node ../../scripts/fork/resolve-ios-native-build.mjs \
            --fingerprint-file "$fingerprint_file" \
            --builds-file "$builds_file" \
            --submitted-fingerprint "$submitted_fingerprint" \
            --force "$([[ "$MODE" == "build" || "$FORCE_IOS" == "true" ]] && echo true || echo false)"
          fingerprint="$(grep '^fingerprint=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2- || true)"
          should_build="$(grep '^should_build=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2- || true)"
          {
            echo "### iOS native binary"
            echo
            echo "- fingerprint: \`${fingerprint:-unknown}\`"
            echo "- should_build: \`${should_build:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: Build and submit iOS
    needs: ota
    if: needs.ota.outputs.should_build == 'true'
    # macos-latest maps to the macos-release queue. The importer rejects
    # self-hosted label lists.
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      # contents:write pushes the automation branch that records
      # `.t3-fork/ios-production-fingerprint` after a local TestFlight
      # submit; pull-requests:write lands that record on main through a
      # pull request because the ruleset rejects direct pushes (GH013).
      contents: write
      pull-requests: write
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      MODE: ${{ github.event_name == 'push' && 'release' || inputs.mode }}
      PLATFORM: ${{ github.event_name == 'push' && 'all' || inputs.platform }}
      FORCE_IOS: ${{ github.event_name == 'workflow_dispatch' && inputs.force_ios || false }}
    steps:
      - name: Ensure runner action externals
        shell: bash
        run: |
          set -euo pipefail
          # Every `uses:` step runs under the runner's own bundled Node. When
          # that tree goes missing - an interrupted runner self-update, macOS
          # quarantining the binary, or a disk sweep that reaps `externals/` -
          # `run:` steps keep working while every action dies with a bare
          # ENOENT naming the node binary. Without this guard the first
          # casualty is whichever action follows the build, so a signed
          # release burns several minutes before failing. Check it up front
          # and restore the runtime from nodejs.org, so a broken runner costs
          # one download instead of parking every release until someone
          # re-extracts the runner package by hand.
          runner_root="$(cd "${RUNNER_TEMP}/../.." && pwd)"
          externals="${runner_root}/externals"
          case "$(uname -m)" in
            arm64|aarch64) node_arch=arm64 ;;
            x86_64) node_arch=x64 ;;
            *) node_arch="" ;;
          esac

          node_ok() {
            [[ -x "$1/bin/node" ]] && "$1/bin/node" --version >/dev/null 2>&1
          }

          # Deliberately no `set -e` reliance: this is called from an `if`,
          # which suppresses errexit for the whole call, so every fallible
          # command has to be checked by hand.
          restore_node() {
            local major="$1" dest="$2" base tmp line sha name src
            [[ -n "$node_arch" ]] || { echo "Unsupported machine $(uname -m)."; return 1; }
            base="https://nodejs.org/download/release/latest-v${major}.x"
            tmp="$(mktemp -d)" || return 1
            echo "Restoring ${dest} from ${base} (darwin-${node_arch})."
            line="$(curl -fsSL --retry 3 "${base}/SHASUMS256.txt" \
              | grep -E "node-v${major}\.[0-9.]+-darwin-${node_arch}\.tar\.gz$" | head -n1)"
            if [[ -z "$line" ]]; then
              echo "No darwin-${node_arch} build listed for node ${major}.x."
              rm -rf "$tmp"; return 1
            fi
            sha="${line%% *}"
            name="${line##* }"
            src="${tmp}/${name%.tar.gz}"
            if ! curl -fsSL --retry 3 -o "${tmp}/${name}" "${base}/${name}"; then
              rm -rf "$tmp"; return 1
            fi
            if ! (cd "$tmp" && printf '%s  %s\n' "$sha" "$name" | shasum -a 256 -c - >/dev/null); then
              echo "Checksum mismatch for ${name}."
              rm -rf "$tmp"; return 1
            fi
            if ! tar -xzf "${tmp}/${name}" -C "$tmp"; then rm -rf "$tmp"; return 1; fi
            rm -rf "${dest}.repair" "${dest}.broken"
            if ! mv "$src" "${dest}.repair"; then rm -rf "$tmp"; return 1; fi
            # A quarantined download is exactly the failure being repaired.
            xattr -rc "${dest}.repair" >/dev/null 2>&1 || true
            if [[ -e "$dest" ]] && ! mv "$dest" "${dest}.broken"; then
              rm -rf "$tmp" "${dest}.repair"; return 1
            fi
            if ! mv "${dest}.repair" "$dest"; then rm -rf "$tmp"; return 1; fi
            rm -rf "${dest}.broken" "$tmp"
            node_ok "$dest"
          }

          for runtime in node24 node20; do
            dest="${externals}/${runtime}"
            # node20 only matters while some action still declares it. Do not
            # conjure it onto runners that have already dropped the runtime.
            if [[ "$runtime" != node24 && ! -d "$dest" ]]; then continue; fi
            if node_ok "$dest"; then
              echo "${runtime} OK (node $("${dest}/bin/node" --version))."
              continue
            fi
            echo "::warning::${dest}/bin/node is missing or unusable; restoring it."
            ls -la "$dest" 2>/dev/null || echo "${dest} does not exist."
            if ! restore_node "${runtime#node}" "$dest"; then
              echo "::error::Runner cannot execute actions: ${dest}/bin/node is missing and could not be restored."
              echo "Repair on the runner host: stop the runner service, re-extract the"
              echo "actions-runner release package over ${runner_root} to restore externals/,"
              echo "then start the service again."
              exit 1
            fi
            echo "Restored ${runtime} (node $("${dest}/bin/node" --version))."
          done

      - name: Checkout
        # Full history: eas-cli archives via `git clone --depth 1 file://`.
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          helper="/opt/homebrew/etc/buildkite-agent/checkout-origin.sh"
          test -x "$helper"
          "$helper" "$CHECKOUT_REF" --full

      - name: Load Buildkite cluster secrets
        shell: bash
        run: bash scripts/fork/load-buildkite-secrets.sh CURSOR_API_KEY

      - name: Prepare macOS runner PATH
        shell: bash
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/sbin" >> "$GITHUB_PATH"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/mobile...
              - --filter=@t3tools/scripts...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # npm, not pnpm: this only installs eas-cli into the action's own
          # tool dir, and pnpm 11 hard-fails that install on dtrace-provider's
          # ignored build script (no allowBuilds config outside the repo).
          packager: npm

      - name: Pull production environment variables
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # app.config.ts reads the repository-root env files, not apps/mobile/.env.local.
        # Local EAS builds pack a gitignore-filtered copy, so also export the
        # pulled values into the job environment for child processes.
        run: |
          set -euo pipefail
          eas env:pull production --path ../../.env.local --non-interactive
          if [[ -f ../../.env.local ]]; then
            grep -vE '^[[:space:]]*(#|$)' ../../.env.local >> "$GITHUB_ENV"
          fi

      - name: Prepare Apple CI credentials
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required for unattended iOS build and submission." >&2
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          chmod 600 "$key_path"
          {
            echo "EXPO_ASC_API_KEY_PATH=$key_path"
            echo "EXPO_ASC_KEY_ID=$APPLE_API_KEY_ID"
            echo "EXPO_ASC_ISSUER_ID=$APPLE_API_ISSUER"
            echo "EXPO_APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "EXPO_APPLE_TEAM_TYPE=INDIVIDUAL"
          } >> "$GITHUB_ENV"

          node --input-type=module - "$key_path" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER" <<'NODE'
          import fs from "node:fs";
          const [keyPath, keyId, issuer] = process.argv.slice(2);
          const easJsonPath = "apps/mobile/eas.json";
          const eas = JSON.parse(fs.readFileSync(easJsonPath, "utf8"));
          eas.submit ??= {};
          eas.submit.production ??= {};
          eas.submit.production.ios = {
            ...eas.submit.production.ios,
            ascApiKeyPath: keyPath,
            ascApiKeyId: keyId,
            ascApiKeyIssuerId: issuer,
          };
          fs.writeFileSync(easJsonPath, `${JSON.stringify(eas, null, 2)}\n`);
          NODE

      - name: Prepare iOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          # m1-dev ships Xcode-beta.app, not Xcode.app. Prefer a pre-set
          # DEVELOPER_DIR, then stable Xcode, then beta, then any other
          # Xcode*.app. Command Line Tools have no iOS SDK; skip them.
          is_full_xcode() {
            [[ -n "$1" && "$1" != *CommandLineTools* && -x "$1/usr/bin/xcodebuild" ]]
          }
          developer_dir=""
          if is_full_xcode "${DEVELOPER_DIR:-}"; then
            developer_dir="$DEVELOPER_DIR"
          else
            for app in /Applications/Xcode.app /Applications/Xcode-beta.app /Applications/Xcode*.app; do
              if is_full_xcode "$app/Contents/Developer"; then
                developer_dir="$app/Contents/Developer"
                break
              fi
            done
          fi
          if [[ -z "$developer_dir" ]]; then
            echo "A full Xcode.app (stable or beta) is required on this runner for local iOS production builds." >&2
            ls -ld /Applications/Xcode*.app 2>/dev/null || echo "No Xcode*.app under /Applications." >&2
            xcode-select -p 2>/dev/null || true
            exit 1
          fi
          echo "Using Xcode at $developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$developer_dir"
          # Fastlane/EAS often call `xcode-select -p` and ignore DEVELOPER_DIR.
          # If CLT is still selected, switch the active directory for this job.
          selected="$(xcode-select -p 2>/dev/null || true)"
          if [[ "$selected" != "$developer_dir" ]]; then
            if sudo -n xcode-select -s "$developer_dir" 2>/dev/null; then
              echo "Switched xcode-select from ${selected:-none} to $developer_dir"
            else
              echo "xcode-select is ${selected:-unset}; could not switch without passwordless sudo." >&2
              echo "On the runner once: sudo xcode-select -s $developer_dir" >&2
            fi
          fi
          xcodebuild -version
          mkdir -p "$HOME/.cache/t3-pretty-release/cocoapods"
          echo "CP_HOME_DIR=$HOME/.cache/t3-pretty-release/cocoapods" >> "$GITHUB_ENV"
          export CP_HOME_DIR="$HOME/.cache/t3-pretty-release/cocoapods"
          if ! command -v pod >/dev/null; then
            brew install cocoapods
          fi
          pod --version
          if ! command -v fastlane >/dev/null; then
            brew install fastlane
          fi
          fastlane --version

      - name: Build and submit
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          # EAS local builds on macOS 26 / Xcode 27 fail Prepare credentials
          # because `security find-identity -v` cannot validate a dist cert in
          # an ephemeral keychain (expo/eas-cli#3678). Put a shim named
          # `security` first on PATH so that lookup drops -v.
          security_wrap="$RUNNER_TEMP/t3-security-wrap"
          mkdir -p "$security_wrap"
          cp "$GITHUB_WORKSPACE/scripts/fork/security-eas-local-keychain" "$security_wrap/security"
          chmod +x "$security_wrap/security"
          export PATH="$security_wrap:$PATH"
          ipa_path="$RUNNER_TEMP/t3-pretty.ipa"
          export EAS_LOCAL_BUILD_ARTIFACTS_DIR="$RUNNER_TEMP/eas-artifacts"
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
          eas build \
            --platform ios \
            --profile production \
            --local \
            --output "$ipa_path" \
            --non-interactive
          if [[ ! -f "$ipa_path" ]]; then
            ipa_path="$(find "$EAS_LOCAL_BUILD_ARTIFACTS_DIR" -name '*.ipa' -print -quit)"
          fi
          test -n "$ipa_path"
          test -f "$ipa_path"
          eas submit \
            --platform ios \
            --profile production \
            --path "$ipa_path" \
            --non-interactive

      - name: Record submitted iOS fingerprint
        if: needs.ota.outputs.fingerprint != ''
        env:
          FINGERPRINT: ${{ needs.ota.outputs.fingerprint }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY || env.CURSOR_API_KEY }}
          ORIGIN_REPO: serbinenko/t3-pretty
        run: |
          set -euo pipefail
          # Local builds never show up in `eas build:list`. Persist the hash
          # that just landed in TestFlight so the next JS-only release can
          # skip Xcode without consulting a hosted EAS build record.
          mkdir -p .t3-fork
          printf '%s\n' "$FINGERPRINT" > .t3-fork/ios-production-fingerprint
          git add -- .t3-fork/ios-production-fingerprint
          if git diff --cached --quiet -- .t3-fork/ios-production-fingerprint; then
            echo "T3CODE iOS production fingerprint already recorded: $FINGERPRINT"
            exit 0
          fi
          git config user.name "t3-pretty-mobile[bot]"
          git config user.email "t3-pretty-bot@users.noreply.cursor.com"
          # --no-verify: the pre-commit hook runs `vp fmt` on staged files, and
          # an extensionless fingerprint record is not a formattable target,
          # which fails the hook and the whole release after a successful
          # build and submit.
          git commit --no-verify -m "chore(mobile): record iOS production fingerprint"

          # main requires pull requests, so the bot commit cannot be pushed
          # directly. Land it through a short-lived Origin PR, the same path
          # the upstream sync uses. `.t3-fork/` is outside every release
          # workflow's path filters, so the merge schedules nothing.
          branch="automation/ios-fingerprint-${FINGERPRINT:0:12}"
          git push --force origin "HEAD:refs/heads/$branch"
          node scripts/fork/origin-forge.mjs setup-ci
          body_path="$RUNNER_TEMP/t3-pretty-ios-fingerprint.md"
          printf '%s\n' \
            "Records the submitted iOS runtime fingerprint so later JS-only releases can skip a native rebuild." \
            > "$body_path"
          node scripts/fork/origin-forge.mjs ensure-pr \
            --base main \
            --head "$branch" \
            --title "chore(mobile): record iOS production fingerprint" \
            --body-file "$body_path"
          node scripts/fork/origin-forge.mjs merge-pr --head "$branch" --sha "$(git rev-parse HEAD)"
          node scripts/fork/origin-forge.mjs delete-branch --head "$branch"
          echo "Recorded .t3-fork/ios-production-fingerprint=$FINGERPRINT"
