name: T3 Pretty Mobile Release

# Production builds and OTA updates run from GitHub-hosted Linux — never from
# the Mac desktop runner. Under the fingerprint runtime-version policy the hash
# must be computed on the same OS as the EAS worker; a macOS `eas update`
# publishes a runtime no existing TestFlight binary can consume, and
# `m1-dev-t3code-fork` does not have Xcode.app for a local EAS compile.
#
# A new IPA is submitted only when the Linux fingerprint differs from the
# latest finished production iOS binary (and any previously recorded local
# submit in `.t3-fork/ios-production-fingerprint`). JavaScript-only releases
# therefore spend no Expo iOS cloud credit.
#
# See docs/operations/fork-mobile-release.md.
on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/**
      - patches/**
      - pnpm-lock.yaml
      - .github/workflows/fork-mobile-release.yml
      - scripts/fork/resolve-ios-native-build.mjs
  workflow_dispatch:
    inputs:
      mode:
        description: "release (OTA + iOS TestFlight), build, or update (OTA only)"
        required: true
        type: choice
        default: release
        options:
          - release
          - build
          - update
      platform:
        description: "OTA target platform. Native binaries are iOS-only cloud builds."
        required: true
        type: choice
        default: ios
        options:
          - ios
          - android
          - all
      message:
        description: "OTA update message (release or update mode)"
        required: false
        type: string

concurrency:
  group: fork-mobile-release
  cancel-in-progress: false

jobs:
  production:
    name: Mobile ${{ github.event_name == 'push' && 'release' || inputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
      # Public fork-owned EAS identity. These must be available before
      # `eas env:pull` so app.config.ts can resolve the project being pulled.
      T3CODE_MOBILE_UPDATE_URL: ${{ vars.T3CODE_MOBILE_UPDATE_URL }}
      T3CODE_MOBILE_EAS_PROJECT_ID: ${{ vars.T3CODE_MOBILE_EAS_PROJECT_ID }}
      T3CODE_MOBILE_EXPO_OWNER: ${{ vars.T3CODE_MOBILE_EXPO_OWNER }}
      T3CODE_MOBILE_EXPO_SLUG: ${{ vars.T3CODE_MOBILE_EXPO_SLUG }}
      T3CODE_APPLE_TEAM_ID: ${{ vars.T3CODE_APPLE_TEAM_ID }}
      T3CODE_IOS_SHARE_EXTENSION: ${{ vars.T3CODE_IOS_SHARE_EXTENSION }}
      # A mobile-relevant push is a complete release: fast OTA delivery for
      # compatible runtimes plus a new iOS binary when the native fingerprint
      # changed.
      MODE: ${{ github.event_name == 'push' && 'release' || inputs.mode }}
      PLATFORM: ${{ github.event_name == 'push' && 'all' || inputs.platform }}
    steps:
      - id: expo-token
        name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "EXPO_TOKEN is required for OTA publishing and managed iOS credentials." >&2
            exit 1
          fi

      - name: Checkout
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # No sparse-checkout here: it makes actions/checkout fetch with
          # --filter=blob:none, and eas-cli archives the project via
          # `git clone --depth 1 file://<workspace>`, which fails (exit 128)
          # when the partial clone can't serve the unfetched blobs.

      - name: Setup Vite+
        if: steps.expo-token.outputs.present == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
              - --filter=@t3tools/scripts...

      - name: Expose pnpm
        if: steps.expo-token.outputs.present == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        if: steps.expo-token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # npm, not pnpm: this only installs eas-cli into the action's own
          # tool dir, and pnpm 11 hard-fails that install on dtrace-provider's
          # ignored build script (no allowBuilds config outside the repo).
          packager: npm

      - name: Pull production environment variables
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # app.config.ts reads the repository-root env files, not apps/mobile/.env.local.
        run: eas env:pull production --path ../../.env.local --non-interactive

      - name: Prepare Apple CI credentials
        if: steps.expo-token.outputs.present == 'true' && (env.MODE == 'build' || env.MODE == 'release')
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required for unattended iOS build and submission." >&2
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          chmod 600 "$key_path"
          {
            echo "EXPO_ASC_API_KEY_PATH=$key_path"
            echo "EXPO_ASC_KEY_ID=$APPLE_API_KEY_ID"
            echo "EXPO_ASC_ISSUER_ID=$APPLE_API_ISSUER"
            echo "EXPO_APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "EXPO_APPLE_TEAM_TYPE=INDIVIDUAL"
          } >> "$GITHUB_ENV"

          # Auto-submit runs after the remote build completes. Add the same ASC
          # key to the submit profile so EAS can retain it for that deferred job.
          node --input-type=module - "$key_path" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER" <<'NODE'
          import fs from "node:fs";
          const [keyPath, keyId, issuer] = process.argv.slice(2);
          const easJsonPath = "apps/mobile/eas.json";
          const eas = JSON.parse(fs.readFileSync(easJsonPath, "utf8"));
          eas.submit ??= {};
          eas.submit.production ??= {};
          eas.submit.production.ios = {
            ...eas.submit.production.ios,
            ascApiKeyPath: keyPath,
            ascApiKeyId: keyId,
            ascApiKeyIssuerId: issuer,
          };
          fs.writeFileSync(easJsonPath, `${JSON.stringify(eas, null, 2)}\n`);
          NODE

      - name: Publish OTA update
        if: steps.expo-token.outputs.present == 'true' && (env.MODE == 'update' || env.MODE == 'release')
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          update_platform="$PLATFORM"
          if [[ "$MODE" == "release" ]]; then
            update_platform=all
          fi
          eas update \
            --channel production \
            --environment production \
            --platform "$update_platform" \
            --message "${{ inputs.message || format('Production OTA ({0})', github.sha) }}" \
            --non-interactive

      - id: native
        name: Decide whether a new iOS binary is required
        if: steps.expo-token.outputs.present == 'true' && (env.MODE == 'build' || env.MODE == 'release')
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "build" && "$PLATFORM" == "android" ]]; then
            echo "Native Android cloud builds are not wired for this fork yet. Production store binaries are iOS-only." >&2
            exit 1
          fi

          fingerprint_file="$RUNNER_TEMP/ios-fingerprint.json"
          builds_file="$RUNNER_TEMP/ios-builds.json"
          if ! eas fingerprint:generate \
            --platform ios \
            --build-profile production \
            --json \
            --non-interactive > "$fingerprint_file"; then
            echo "Could not generate the iOS fingerprint; building a native binary to be safe."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! eas build:list \
            --platform ios \
            --build-profile production \
            --distribution store \
            --status finished \
            --limit 1 \
            --json \
            --non-interactive > "$builds_file"; then
            echo "[]" > "$builds_file"
          fi

          submitted_fingerprint=""
          if [[ -f ../../.t3-fork/ios-production-fingerprint ]]; then
            submitted_fingerprint="$(tr -d '[:space:]' < ../../.t3-fork/ios-production-fingerprint)"
          fi
          node ../../scripts/fork/resolve-ios-native-build.mjs \
            --fingerprint-file "$fingerprint_file" \
            --builds-file "$builds_file" \
            --submitted-fingerprint "$submitted_fingerprint" \
            --force "$([[ "$MODE" == "build" ]] && echo true || echo false)"

      - name: Build and submit
        if: steps.expo-token.outputs.present == 'true' && steps.native.outputs.should_build == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build \
            --platform ios \
            --profile production \
            --auto-submit \
            --non-interactive \
            --no-wait
