name: Temporary Buildkite secret bridge

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: temporary-buildkite-secret-bridge
  cancel-in-progress: false

env:
  BUILDKITE_SECRETS_URL: https://api.buildkite.com/v2/organizations/serge-serbinenkos-org/clusters/bf7c9e74-0adb-423f-a703-1b35b96eb7d0/secrets

jobs:
  repository-secrets:
    if: github.actor == 'SergeSerb2'
    runs-on: ubuntu-latest
    env:
      BUILDKITE_SECRET_BRIDGE_TOKEN: ${{ secrets.BUILDKITE_SECRET_BRIDGE_TOKEN }}
      CLI_PROXY_API_KEY: ${{ secrets.CLI_PROXY_API_KEY }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      VITE_SCENERY_UNSPLASH_KEY: ${{ secrets.VITE_SCENERY_UNSPLASH_KEY }}
      APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
    steps:
      - name: Copy repository secrets into Buildkite
        shell: bash
        run: |
          set -euo pipefail

          create_secret() {
            local key="$1"
            local description="$2"
            local value="${!key:-}"
            local response_file="$RUNNER_TEMP/buildkite-${key}.json"
            local http_code

            if [[ -z "$value" ]]; then
              echo "Missing GitHub secret: $key" >&2
              return 1
            fi

            if (( ${#value} >= 8192 )); then
              echo "Secret exceeds the Buildkite REST API size limit: $key" >&2
              return 1
            fi

            http_code=$(
              jq -n \
                --arg key "$key" \
                --arg value "$value" \
                --arg description "$description" \
                '{key: $key, value: $value, description: $description}' |
                curl \
                  --silent \
                  --show-error \
                  --output "$response_file" \
                  --write-out '%{http_code}' \
                  --request POST \
                  --header "Authorization: Bearer $BUILDKITE_SECRET_BRIDGE_TOKEN" \
                  --header 'Content-Type: application/json' \
                  --data-binary @- \
                  "$BUILDKITE_SECRETS_URL"
            )

            if [[ "$http_code" != 201 ]]; then
              echo "Buildkite rejected $key with HTTP $http_code" >&2
              return 1
            fi

            rm -f "$response_file"
            echo "Created $key"
          }

          create_secret CLI_PROXY_API_KEY "Upstream conflict resolution and What's New"
          create_secret CSC_LINK "Base64-encoded macOS Developer ID certificate"
          create_secret CSC_KEY_PASSWORD "Password for the macOS signing certificate"
          create_secret APPLE_API_KEY "App Store Connect API private key"
          create_secret APPLE_API_KEY_ID "App Store Connect API key ID"
          create_secret APPLE_API_ISSUER "App Store Connect API issuer ID"
          create_secret EXPO_TOKEN "Expo and EAS mobile release token"
          create_secret VITE_SCENERY_UNSPLASH_KEY "Unsplash access key for desktop scenery"
          create_secret APNS_PRIVATE_KEY "Apple Push Notification service private key"

  production-secret:
    if: github.actor == 'SergeSerb2'
    runs-on: ubuntu-latest
    environment: production
    env:
      BUILDKITE_SECRET_BRIDGE_TOKEN: ${{ secrets.BUILDKITE_SECRET_BRIDGE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Copy production Cloudflare token into Buildkite
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$BUILDKITE_SECRET_BRIDGE_TOKEN" ]]; then
            echo 'Missing GitHub secret: BUILDKITE_SECRET_BRIDGE_TOKEN' >&2
            exit 1
          fi

          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'Missing production GitHub secret: CLOUDFLARE_API_TOKEN' >&2
            exit 1
          fi

          response_file="$RUNNER_TEMP/buildkite-CLOUDFLARE_API_TOKEN.json"
          http_code=$(
            jq -n \
              --arg key CLOUDFLARE_API_TOKEN \
              --arg value "$CLOUDFLARE_API_TOKEN" \
              --arg description "Cloudflare API token for release uploads" \
              '{key: $key, value: $value, description: $description}' |
              curl \
                --silent \
                --show-error \
                --output "$response_file" \
                --write-out '%{http_code}' \
                --request POST \
                --header "Authorization: Bearer $BUILDKITE_SECRET_BRIDGE_TOKEN" \
                --header 'Content-Type: application/json' \
                --data-binary @- \
                "$BUILDKITE_SECRETS_URL"
          )

          if [[ "$http_code" != 201 ]]; then
            echo "Buildkite rejected CLOUDFLARE_API_TOKEN with HTTP $http_code" >&2
            exit 1
          fi

          rm -f "$response_file"
          echo 'Created CLOUDFLARE_API_TOKEN'
