name: Mobile EAS Production

# Production builds and OTA updates run from CI (Linux) — never from a laptop.
# Under the fingerprint runtime-version policy the fingerprint must be computed
# in the same OS/pnpm as the EAS build; a macOS `eas build` computes a different
# fingerprint (platform-specific deps + pnpm version) and errors. On this Linux
# runner, with corepack pinning pnpm 10.24 in eas.json, local == build.
#
# Fork release train: every mobile-relevant merge to main publishes an OTA
# update for both platforms and queues a production iOS build for TestFlight.
# Manual dispatch can run that complete release or either half independently.
# See docs/operations/fork-mobile-release.md.
on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/**
      - patches/**
      - pnpm-lock.yaml
      - .github/workflows/mobile-eas-production.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "release (OTA + iOS TestFlight), build, or update (OTA only)"
        required: true
        type: choice
        default: release
        options:
          - release
          - build
          - update
      platform:
        description: "Target platform"
        required: true
        type: choice
        default: ios
        options:
          - ios
          - android
          - all
      message:
        description: "OTA update message (release or update mode)"
        required: false
        type: string

concurrency:
  group: mobile-eas-production
  cancel-in-progress: false

jobs:
  production:
    name: EAS Production ${{ github.event_name == 'push' && 'release' || inputs.mode }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
      # Public fork-owned EAS identity. These must be available before
      # `eas env:pull` so app.config.ts can resolve the project being pulled.
      T3CODE_MOBILE_UPDATE_URL: ${{ vars.T3CODE_MOBILE_UPDATE_URL }}
      T3CODE_MOBILE_EAS_PROJECT_ID: ${{ vars.T3CODE_MOBILE_EAS_PROJECT_ID }}
      T3CODE_MOBILE_EXPO_OWNER: ${{ vars.T3CODE_MOBILE_EXPO_OWNER }}
      T3CODE_MOBILE_EXPO_SLUG: ${{ vars.T3CODE_MOBILE_EXPO_SLUG }}
      T3CODE_APPLE_TEAM_ID: ${{ vars.T3CODE_APPLE_TEAM_ID }}
      T3CODE_IOS_SHARE_EXTENSION: ${{ vars.T3CODE_IOS_SHARE_EXTENSION }}
      # A mobile-relevant push is a complete release: fast OTA delivery for
      # compatible runtimes plus a new iOS binary for native runtime changes.
      MODE: ${{ github.event_name == 'push' && 'release' || inputs.mode }}
      PLATFORM: ${{ github.event_name == 'push' && 'all' || inputs.platform }}
    steps:
      - id: expo-token
        name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "EXPO_TOKEN is required for the active fork-owned EAS release train." >&2
            exit 1
          fi

      - name: Checkout
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # No sparse-checkout here: it makes actions/checkout fetch with
          # --filter=blob:none, and eas-cli archives the project via
          # `git clone --depth 1 file://<workspace>`, which fails (exit 128)
          # when the partial clone can't serve the unfetched blobs.

      - name: Setup Vite+
        if: steps.expo-token.outputs.present == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        if: steps.expo-token.outputs.present == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        if: steps.expo-token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # npm, not pnpm: this only installs eas-cli into the action's own
          # tool dir, and pnpm 11 hard-fails that install on dtrace-provider's
          # ignored build script (no allowBuilds config outside the repo).
          packager: npm

      - name: Pull production environment variables
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # app.config.ts reads the repository-root env files, not apps/mobile/.env.local.
        run: eas env:pull production --path ../../.env.local --non-interactive

      - name: Prepare Apple CI credentials
        if: steps.expo-token.outputs.present == 'true' && (env.MODE == 'build' || env.MODE == 'release')
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required for unattended iOS build and submission." >&2
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          chmod 600 "$key_path"
          {
            echo "EXPO_ASC_API_KEY_PATH=$key_path"
            echo "EXPO_ASC_KEY_ID=$APPLE_API_KEY_ID"
            echo "EXPO_ASC_ISSUER_ID=$APPLE_API_ISSUER"
            echo "EXPO_APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "EXPO_APPLE_TEAM_TYPE=INDIVIDUAL"
          } >> "$GITHUB_ENV"

          # Auto-submit runs after the remote build completes. Add the same ASC
          # key to the submit profile so EAS can retain it for that deferred job.
          jq \
            --arg path "$key_path" \
            --arg id "$APPLE_API_KEY_ID" \
            --arg issuer "$APPLE_API_ISSUER" \
            '.submit.production.ios += {
              ascApiKeyPath: $path,
              ascApiKeyId: $id,
              ascApiKeyIssuerId: $issuer
            }' \
            apps/mobile/eas.json > "$RUNNER_TEMP/eas.json"
          mv "$RUNNER_TEMP/eas.json" apps/mobile/eas.json

      - name: Publish OTA update
        if: steps.expo-token.outputs.present == 'true' && (env.MODE == 'update' || env.MODE == 'release')
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          update_platform="$PLATFORM"
          if [[ "$MODE" == "release" ]]; then
            update_platform=all
          fi
          eas update \
            --channel production \
            --environment production \
            --platform "$update_platform" \
            --message "${{ inputs.message || format('Production OTA ({0})', github.sha) }}" \
            --non-interactive

      - name: Build and submit
        if: steps.expo-token.outputs.present == 'true' && (env.MODE == 'build' || env.MODE == 'release')
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          build_platform="$PLATFORM"
          if [[ "$MODE" == "release" ]]; then
            build_platform=ios
          fi
          eas build \
            --platform "$build_platform" \
            --profile production \
            --auto-submit \
            --non-interactive \
            --no-wait
