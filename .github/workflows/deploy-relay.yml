name: Deploy T3 Connect relay

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-production
  cancel-in-progress: false

# Buildkite's importer does not copy pipeline `env:`, GitHub `vars.*`, or
# the production environment. Public IDs stay here as literals. Private
# tokens load after checkout so a failed `secrets.*` interpolation cannot
# take down the rest of the Origin importer.
env:
  CLOUDFLARE_ACCOUNT_ID: a6f705b8c6459d937d32d31555f9fbf6
  PLANETSCALE_ORGANIZATION: serge-serbinenko
  AXIOM_ORG_ID: surgecode-nmf2
  RELAY_DOMAIN: relay.sergeserbinenko.com
  RELAY_API_ZONE_NAME: sergeserbinenko.com
  RELAY_TUNNEL_ZONE_NAME: sergeserbinenko.com
  CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuc2VyZ2VzZXJiaW5lbmtvLmNvbSQ
  CLERK_JWT_AUDIENCE: t3-code-relay
  APNS_ENVIRONMENT: production
  APNS_TEAM_ID: "336W29P997"
  APNS_KEY_ID: 6RKSND9F2B
  APNS_BUNDLE_ID: com.sergeserb.sergecode
  ALCHEMY_TELEMETRY_DISABLED: "1"

jobs:
  deploy_relay:
    name: Deploy production relay
    # macos-release can read the file-store fallbacks that hosted linux-small
    # cannot. Clerk / PlanetScale / Axiom tokens are not interpolatable on
    # the importer without risking a failed `secrets.*` resolve.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Prepare macOS runner PATH
        shell: bash
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/sbin" >> "$GITHUB_PATH"
          echo "${HOME}/.vite-plus/bin" >> "$GITHUB_PATH"

      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          helper="/opt/homebrew/etc/buildkite-agent/checkout-origin.sh"
          test -x "$helper"
          "$helper" "${GITHUB_SHA:-main}" --full

      - name: Load Buildkite cluster secrets
        shell: bash
        env:
          # These two exist in the cluster and interpolate on macos-release.
          # Do not add Clerk/PlanetScale/Axiom here: a failed secrets.*
          # resolve aborts the whole Origin importer.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
        run: |
          bash scripts/fork/load-buildkite-secrets.sh \
            CLOUDFLARE_API_TOKEN \
            PLANETSCALE_API_TOKEN_ID \
            PLANETSCALE_API_TOKEN \
            AXIOM_TOKEN \
            CLERK_SECRET_KEY \
            APNS_PRIVATE_KEY

      - name: Require relay deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            CLOUDFLARE_API_TOKEN \
            PLANETSCALE_API_TOKEN_ID \
            PLANETSCALE_API_TOKEN \
            CLERK_SECRET_KEY \
            APNS_PRIVATE_KEY
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing relay secrets: ${missing[*]}" >&2
            exit 1
          fi
          if [[ -z "${AXIOM_TOKEN:-}" ]]; then
            echo "AXIOM_TOKEN is unset; deploy will skip Axiom-backed tracing if the stack requires it."
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3code-relay...

      - name: Configure Clerk desktop origins
        run: vp run --filter t3code-relay configure-clerk

      - name: Deploy production relay stage
        id: deploy
        run: vp run --filter t3code-relay deploy --stage prod --yes --github-output

      - name: Summarize relay deploy
        run: |
          echo "Relay deploy result=${{ steps.deploy.outputs.result }} changed=${{ steps.deploy.outputs.changed }}"
