name: T3 Pretty Origin PR Review

# Grok 4.6 reviews every Origin pull request. Hosted linux-small posts the
# review through the Origin CLI. Release runners stay off pull-request jobs.
# See docs/operations/fork-release.md.

on:
  # Do not use `on.pull_request`. Origin's Buildkite importer builds a
  # pull_request snapshot without payload.action, so any PR trigger
  # fails the check with "pull_request event snapshot requires
  # payload.action". Branch pushes already start a Buildkite build;
  # the script resolves the open Origin PR from the head branch.
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      pr:
        description: Origin pull request number
        required: false
        type: string

concurrency:
  group: fork-pr-review-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review Origin PR with Grok 4.6
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Load Buildkite cluster secrets
        shell: bash
        run: bash scripts/fork/load-buildkite-secrets.sh CURSOR_API_KEY XAI_API_KEY GROK_API_KEY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Authenticate Origin CLI
        shell: bash
        run: node scripts/fork/origin-forge.mjs setup-ci

      - name: Review with grok-4.6
        shell: bash
        env:
          ORIGIN_REPO: serbinenko/t3-pretty
          ORIGIN_PR: ${{ github.event.inputs.pr || github.event.pull_request.number || '' }}
          ORIGIN_PR_HEAD: ${{ github.head_ref || github.ref_name }}
          XAI_REVIEW_MODEL: grok-4.6
        run: node scripts/fork/review-origin-pr.mjs
