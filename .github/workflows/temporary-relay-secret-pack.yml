name: Temporary relay secret pack

# One-shot: encrypt production relay secrets so they can be installed on
# macos-release. Delete this workflow after the pack is consumed.
on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: "openssl passphrase for the encrypted pack"
        required: true
        type: string

permissions: {}

concurrency:
  group: temporary-relay-secret-pack
  cancel-in-progress: false

jobs:
  pack:
    if: github.actor == 'SergeSerb2'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
      PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
      AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
      APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PACK_PASSPHRASE: ${{ inputs.passphrase }}
    steps:
      - name: Encrypt production secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir pack
          for name in \
            CLERK_SECRET_KEY \
            PLANETSCALE_API_TOKEN_ID \
            PLANETSCALE_API_TOKEN \
            AXIOM_TOKEN \
            APNS_PRIVATE_KEY \
            CLOUDFLARE_API_TOKEN
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production secret: $name" >&2
              exit 1
            fi
            printf '%s' "${!name}" > "pack/$name"
          done
          tar -C pack -cf secrets.tar .
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass env:PACK_PASSPHRASE \
            -in secrets.tar \
            -out relay-secrets.tar.enc
          rm -rf pack secrets.tar

      - name: Upload encrypted pack
        uses: actions/upload-artifact@v4
        with:
          name: relay-secrets
          path: relay-secrets.tar.enc
          retention-days: 1
